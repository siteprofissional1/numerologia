# Publicação automática: primeiro verifica a aplicação, depois disponibiliza o HTML aprovado.
name: Publicar Numerologia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # A leitura do código basta para testar; a permissão de publicação fica no segundo job.
  contents: read

concurrency:
  # Publicações do mesmo site são enfileiradas para evitar disputa pelo ambiente Pages.
  group: github-pages
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # No runner Linux, instala o navegador e suas bibliotecas para os testes de interface.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: falhas-de-interface
          path: test-results/
      - uses: actions/configure-pages@v5
      - name: Preparar site
        # O artefato público contém apenas a página pronta, sem ferramentas ou arquivos de teste.
        run: |
          mkdir -p site
          cp index.html .nojekyll site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publicar:
    # needs impede publicar caso qualquer verificação do primeiro job falhe.
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
