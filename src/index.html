<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Mapas numerológicos calculados no seu aparelho, a partir do nome e da data de nascimento." />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ffffff" />
    <title>Mapa Numerológico</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232b4c7e'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' fill='white' text-anchor='middle'%3E9%3C/text%3E%3C/svg%3E" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <a class="pular" href="#conteudo">Pular para o conteúdo</a>
    <div class="app">
      <header class="topo">
        <div class="marca">
          <span class="marca-nome">Mapa Numerológico</span>
        </div>
        <button type="button" class="botao-menu" id="botao-menu" aria-expanded="false" aria-controls="navegacao">Seções</button>
        <div class="tema" role="group" aria-label="Tema da tela">
          <button type="button" class="tema-botao" id="tema-claro" aria-pressed="true" aria-label="Tema claro: fundo branco e letras pretas" title="Fundo branco e letras pretas">☀️</button>
          <button type="button" class="tema-botao" id="tema-escuro" aria-pressed="false" aria-label="Tema escuro: fundo preto e letras brancas" title="Fundo preto e letras brancas">🌙</button>
        </div>
      </header>
      <nav class="lateral" id="navegacao" aria-label="Seções do aplicativo"></nav>
      <main class="conteudo" id="conteudo" tabindex="-1">
        <noscript>Este aplicativo calcula tudo no navegador e precisa de JavaScript ativado.</noscript>
      </main>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <dialog class="detalhe" id="detalhe" aria-labelledby="detalhe-titulo"></dialog>
  </body>
</html>
