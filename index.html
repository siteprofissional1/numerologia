ntensa, coisas que só lhe farão bem.","dia.22":"Você que nasceu sob a influência do 22, um número principal, conforme encarar as coisas, poderá sentir-se feliz ou infeliz: todavia, é difícil você chegar sozinho a uma conclusão.\\n\\nVocê gostaria de encontrar um mundo o melhor possível, permitindo-lhe manter o equilíbrio mental e os pés na terra. Mostre ao mundo o seu interesse pelas coisas públicas, já que as causas humanitárias e os movimentos de ajuda se adaptam às suas qualidades.\\n\\nSuas idéias levam-no a buscar horizontes mais amplos do que a média das pessoas, mas você precisará de coragem e decisão para manter os olhos nos seus ideais e os pés nesta bela terra.\\n\\nSe ainda não estiver preparado para isso, reduza a 4 o número de seu nascimento, e procure orientar-se por ele.","dia.23":"Você é independente, auto-suficiente, orgulhoso e responsável. Quando está diante de um problema, tem raciocínio rápido e notável capacidade de análise que o leva a diagnosticar, com acerto, a doença no corpo político de uma organização.\\n\\nVocê terá mais sucesso com o sexo oposto do que com o seu próprio sexo; o mesmo acontecerá com as pessoas mais velhas, junto às quais você será mais bem sucedido do que junto às mais moças. Você se adapta facilmente às mudanças no seu meio e na sua vida.\\n\\nSendo muito versátil, pode aventurar-se nos negócios, no mundo das diversões ou nas profissões médicas.","dia.24":"Dotado de surpreendente energia, você precisa estar sempre em atividade, em constante movimento. O número 24 lhe dá condições de assumir responsabilidades, principalmente na família ou na comunidade, dois mundos em que você colocou seu verdadeiro interesse.\\n\\nVocê tem os defeitos correspondentes a suas virtudes, pois também pode ficar ansioso e preocupado com a possibilidade de não realizar o que lhe parece certo.\\n\\nChegar aos seus objetivos lhe custará, sem dúvida, um trabalho árduo, mas você os atingirá, possivelmente, no campo educacional.","dia.25":"Você é intuitivo, cheio de inspiração. Seu hábito de ocultar pensamentos e sentimentos o toma frequentemente mal-compreendido. O sucesso é indispensável para que possa manter sua auto-estima. Estabelecendo para si mesmo padrões de perfeição, fica deprimido e mal-humorado quando não consegue alcançá-los. Nunca subestime a si mesmo!\\n\\nEssas influências poderão conduzi-lo a atividades criativas como as vendas. Contudo, você deverá desenvolver seu poder de concentração e evitar a melancolia e as variações de humor.\\n\\nA cidade, com suas luzes, não é o melhor ambiente para você, que, para ser feliz, necessita da vida simples do campo.","dia.26":"Você ama, acima de tudo, o lar e os filhos. Em sua vida, tudo o mais fica em segundo plano.\\n\\nEntretanto, apesar disso, poderá ser muito bem sucedido no campo dos negócios, pois é um organizador nato e um excelente executivo. Você sempre se enche de entusiasmo ao começar qualquer coisa, mas nem sempre acha tão fácil terminá-las. Por isso, está precisando de mais persistência para dar continuidade ao seus empreendimentos.\\n\\nO orgulho da posição e do status é muito forte em você. Assim, o casamento não é aconselhável, a não ser que tenha muito dinheiro ou condições de consegui-lo.\\n\\nNão viva a remoer o passado e não permita que suas emoções o atormentem.","dia.27":"Você tem força, determinação e altos ideais, de modo que é um líder natural. Disto você deverá se lembrar por toda sua vida e esforçar-se por liderar, ou trabalhar por conta própria, a posição de subalterno ou sociedade meio a meio não se adequando a você.\\n\\nNa amizade e no casamento, você tem muito a dar em termos de companheirismo e afeição. Seu \\"sexto sentido\\" é forte, e sua data de nascimento tende a atraí-lo para a metafísica e a filosofia.\\n\\nSeu principal problema é que quando as coisas começam a sair erradas, você poderá se permitir ataques de introversão e repugnância cega; controle estas tendências e seus relacionamentos irão bem. A atividade literária ou artística seria a melhor para você.","dia.28":"Seu aniversário indica um caráter forte, e que prefere o anticonvencional dentro dos limites do convencional. É dominante, independente e ambicioso, e deveria trabalhar com alguma capacidade individual, se bem que dentro de algum grupo organizado.\\n\\nÉ inclinado a sonhar, e então trabalhar por seus ideais. Tendo-os atingido, tenderá, por vezes, a perder o interesse.\\n\\nA liberdade é muito importante para você, mas frequentemente se sente encurralado, e raramente se sente disposto a aceitar a situação; de fato, poderá criar grandes casos com estas situações.\\n\\nO inusitado o interessa.","dia.29":"Na numerologia, este é considerado um grande aniversário. É um dia que tende a levá-lo perante o público, pois você é intuitivo e idealista, com fortes qualidades de liderança.\\n\\nDesgraçadamente, você é inclinado à melancolia e volubilidade, por causa de seus fortes sentimentos; com você, o bem é sempre o muito bom, e o mal é sempre muito mau.\\n\\nVocê vive numa gangorra emocional, não sendo assim de convívio fácil, nem fácil de entender. Os interesses fora de seu trabalho podem ser um conforto e ajudá-lo a manter-se calmo e sereno. Precisa de uma válvula para seu senso artístico e dramático, talvez escrevendo, ou pela música. Pode ser tremendamente bem sucedido se outros fatores de seu numeroscópio concordarem.","dia.30":"Você nasceu dotado de privilegiada imaginação. Assim, esse deve ser o caminho a trilhar para a auto-realização, indispensável à sua felicidade. O teatro e a literatura poderiam ser, para você, meios naturais de expressão; mas nunca se mantenha preso a um trabalho rotineiro para não ter do que se arrepender mais tarde.\\n\\nMuito cedo todos perceberão que é inútil discutir com você, pois suas idéias são arraigadas e você não parece disposto a abrir mão delas. Embora, por vezes, possa parecer uma pessoa de humor desigual, pode ser um bom amigo e se tornar muito popular.\\n\\nUma vez que tem ideais de grande força, qualquer trabalho de cunho social poderá atraí-lo. Além disso, qualquer atividade que permita o desenvolvimento dos seus talentos artísticos, também o interessará. Você tem condições de fazer bem e simultaneamente diversas coisas, mas, devido a sua tendência à precipitação, correrá o risco de esbanjar as suas energias.","dia.31":"Do tipo construtivo, capaz de um trabalho duro e continuado, você tem condições de construir, para você e sua família, uma vida tranqüila. Profundamente leal com os amigos e com os companheiros de trabalho, você pode, no entanto, revelar-se obstinado, incapaz de mudar de idéias e de opiniões, principalmente se já tiver passado a juventude.\\n\\nVocê precisa de companhia, de apoio de uma família bem constituída para poder ser bem sucedido; mas apreciará viajar, sempre que houver ocasião para isso.\\n\\nJamais coloque alto demais os seus objetivos; torne razoáveis as suas ambições, pois só assim não sofrerá decepções. O número 31 lhe confere um conhecimento natural de drogas e ervas, o interesse pelas questões de saúde e da cura das doenças, o que, muitas vezes, lhe poderá ser bastante útil.\\n\\nVocê chegará ao sucesso se tiver o cuidado de colocar, sobre sólidos alicerces, todas as suas realizações.","aptidao.1":"Liderança, pioneirismo, originalidade, independência, decisão e energia.","aptidao.2":"Diplomacia, cooperação, sensibilidade, melancolia, indecisão e deliberação.","aptidao.3":"Sociabilidade, auto-expressão, otimismo, imaginação e facilidade de falar e escrever.","aptidao.4":"Espírito prático, dedicação, trabalho, economia, limitação, saúde e tendência à obstinação.","aptidao.5":"Liberdade, variedade, adaptabilidade, mudança, atração pelo sexo oposto, desembaraço e simulação.","aptidao.6":"Amor, ideais, espírito doméstico, solicitude, proteção, casamento, adaptação, equilíbrio e tendências artísticas.","aptidao.7":"Poder de análise, introspecção, discrição, fé, sabedoria, paz, tranqüilidade.","aptidao.8":"Capacidade de execução, discernimento, poder material, sucesso e ambição.","aptidao.9":"Amor universal, senso de fraternidade, solicitude, compaixão, compreensão, habilidades artísticas e literárias.","falta.1":"Falta de ambição, independência e originalidade. Egocentrismo e indolência.","falta.2":"Falta de cooperação ou de consideração pelos outros, pouco senso de ritmo e harmonia. Falta de tato e de diplomacia.","falta.3":"Impaciência, dificuldade de expressão. Falta de imaginação, temperamento agitado, atividades em excesso. Talvez um complexo de inferioridade.","falta.4":"Aversão pelo trabalho, preocupação com os pormenores, concentração, tendência a impacientar-se.","falta.5":"Aversão ou medo de mudança, falta de curiosidade, desejo de perpetuar coisas e situações.","falta.6":"Falta de ideais, negligência em relação ao dever, recusa de assumir responsabilidades.","falta.7":"Não analisa, não é introspectivo, ignora a intuição.","falta.8":"Carência de bom discernimento; profundo senso do valor do dinheiro; preocupa-se muito com o dinheiro sem motivos ou, também sem motivos relega a questão financeira a plano secundário.","falta.9":"Estreiteza de visão, falta de compaixão, de compreensão, pouco interesse pelos outros ou pelo bem da humanidade.","pinaculo.1":"Dá oportunidades de independência e originalidade e permite que se fique à frente das coisas. Período ativo, em que a pessoa deve manter-se sobre seus próprios pés. Há possibilidade de mudanças imprevistas.","pinaculo.2":"Trabalhos a serem divididos com outros. Não fique só. Busque sempre a cooperação que, com a diplomacia, são atitudes-chave.","pinaculo.3":"Tempo excelente para viagens, para desenvolver as aptidões criadoras, literárias ou sociais. As amizades são de grande importância, tanto quanto aos prazeres dos sentidos. Mas não seja esbanjador com o amor ou o dinheiro.","pinaculo.4":"Um período prático, no qual não se poderá fazer mais do que permanecer no trabalho, cumprindo os deveres e compromissos e construindo para o futuro.","pinaculo.5":"Tempo livre e cheio de mudanças, viagens, novas relações e incerteza, mas, sem dúvida, um interessante período de experiências na vida.","pinaculo.6":"Habitualmente, é o tempo em que se tem oportunidade de casar, construir um lar, ter filhos. A família e as responsabilidades são o aspecto marcante deste período.","pinaculo.7":"Um tranqüilo período de crescimento espiritual e mental. Desenvolvimento do espírito. Este pode ser um tempo de solidão e de dificuldades com a saúde. Favorável à especialização.","pinaculo.8":"Este será um bom tempo para as finanças, desde que se faça o maior esforço e que se saiba escolher. Boa posição e responsabilidade, em geral, em uma organização.","pinaculo.9":"Período em que é possível adquirir grande conhecimento e compreensão da vida. Haverá decepções no terreno pessoal, relativamente ao amor, ao dinheiro ou à amizade. Uma dura lição a ser aprendida, indicando como viver para os outros, sem egoísmo.","pinaculo.11":"Tempo de êxito na realização de ideais. Será bem'sucedido na defesa dos próprios interesses, assim como dos da infância.","pinaculo.22":"Tempo favorável a planos de futuro e desenvolvimento, talvez em escala internacional.","oraculo.amor.1":"Significa que você é sincero em seus sentimentos e que está procurando aquela a quem deve amar. O amor será romântico, afastado das coisas comuns do mundo. Precaução a tomar: você poderá ser um pouco egoísta, o que será um elemento contra a sua felicidade.","oraculo.amor.2":"Você busca, antes de mais nada, segurança. Isso porque deseja ter o seu próprio lar, família e filhos, aos quais você pretende amar e defender. Contudo, você detesta ter de procurar esse amor, preferindo que ele venha espontaneamente ao seu encontro. Mas lembre-se, não deve exagerar nessa atitude, pois poderia perdê-lo.","oraculo.amor.3":"Sua atitude em relação ao amor é a da despreocupação. Não deve ficar parado, mas partir para o exame daquilo que lhe é oferecido. Esse será um amor passageiro, mas sincero enquanto durar. Não se furte a ele.","oraculo.amor.4":"Sua atitude em relação ao amor é de firmeza e lealdade. Você considera o amor como uma extensão da camaradagem em geral. Você é estável nas suas relações amorosas e precisa de um companheiro sincero e econômico.","oraculo.amor.5":"Os laços familiares são, para você, muito importantes; assim, tenha filhos no seu casamento. Você é uma pessoa romântica e gosta de viagens, o que lhe poderá dar oportunidade de encontrar um companheiro no exterior. A realização, para você, está no amor e no casamento. Então procure um companheiro que respeite estes mesmos valores propiciando-lhe, ao mesmo tempo, estabilidade material.","oraculo.amor.6":"Você é do tipo doméstico. Portanto, antes de mais nada e acima de tudo, você precisa encontrar um companheiro que aprecie essas virtudes e seja compreensivo. O lado prático do casamento sempre será importante para você; portanto, antes de assumir um compromisso definitivo, verifique se este aspecto está garantido. Você é amadurecido, afetivo e razoável e, possivelmente, terá uma vida feliz.","oraculo.amor.7":"Você é exigente e escolhe com muito cuidado seus amigos e amantes. Todavia, como exige perfeição, muitas vezes fica sozinho, sem amores nem amigos. Você não está convencido dos benefícios do casamento ou de um relacionamento amoroso mais estável. O seu espírito crítico leva-o à solidão e afasta as outras pessoas.","oraculo.amor.8":"Sua atitude em relação ao amor inclui, também, o dinheiro. Você não acredita na velha história \\"de um amor e uma cabana\\". O amor é muito importante para você, mas deve vir acompanhado do dinheiro. Contudo, não exagere a importância da riqueza pois, quando você abrir os olhos, estará casado com uma \\"profissão\\" e não com uma pessoa.","oraculo.amor.9":"Você é de natureza generosa e acredita que o amor pode ampliar seus horizontes, permitindo que você leve à prática alguns de seus ideais. Precisa de um companheiro tão generoso e afetivo quanto você.","oraculo.amor.11":"Na busca de um companheiro, você é atraído pelas pessoas não convencionais. Além disso, acredita que a pessoa certa virá ao seu encontro, porque acha que isto faz parte do seu destino. Mas não seja tão passivo em relação a isso. Faça como as demais pessoas: lute e não espere que o seu amor caia do céu.","oraculo.amor.22":"Você é do tipo idealista. Não terá muita facilidade em encontrar o companheiro mais adequado, talvez porque a sua atitude em relação ao sexo seja um pouco rígida, o que dificulta qualquer forma de adaptação. Lute contra as inibições e poderá ser feliz.","oraculo.dinheiro.1":"Se este é o seu número, o dinheiro, em si mesmo, não tem muita importância para você que, no entanto, alegra-se quando consegue receber compensações financeiras. O dinheiro virá através dos seus esforços, atitudes criadoras e, também, através de seus contatos com pessoas que sabem lidar com o dinheiro. Resumindo: dinheiro é bom, mas o amor é mais importante para você.","oraculo.dinheiro.2":"Para você, que está sob a influência do número 2, o dinheiro significa segurança, especialmente em relação ao lar, à família e aos filhos. Você nunca pensa no dinheiro como um fim em si mesmo. Você deve ser prudente, pois, quando usa suas habilidades diplomáticas sempre sai ganhando, o oposto do que ocorre quando você quer impor seu ponto de vista.","oraculo.dinheiro.3":"Se o 3 é o seu número, toda a felicidade para você está no dinheiro. Você é imprudente como um jogador. Na verdade, não consegue encarar o dinheiro com seriedade e não se preocupa com este fator, no que concerne às demais pessoas. Por exemplo: não paga suas contas em dia. Você pode não se preocupar com isto, mas tenha a certeza que cria problemas para muitas pessoas.","oraculo.dinheiro.4":"As pessoas de número 4 encaram o dinheiro com muita seriedade e estão preparadas para trabalhar a fim de consegui-lo. Todavia, tendem a ficar inseguras quando se trata de finanças e são pessimistas quanto às oportunidades financeiras. Sem dúvida, você precisará trabalhar para progredir, mas tenha cuidado para não se tornar avarento.","oraculo.dinheiro.5":"Em relação ao dinheiro, você que é do número S gosta de aplicar em viagens tudo o que consegue, acreditando que, em outros países, terá oportunidades no campo romântico. Para ter segurança, você deve ligar-se ao meio das comunicações, escrevendo, vendendo, fazendo corretagem ou exercendo qualquer atividade na área publicitária. Você se sente atraído por estas profissões, que lhe dão segurança sem tolher sua liberdade. Provavelmente a vida lhe reservará romances e dinheiro.","oraculo.dinheiro.6":"Quando você não tem dinheiro suficiente, cai em pânico, pois o dinheiro é o único antídoto contra a sua insegurança. Acredita que o dinheiro é necessário para o casamento, as viagens ou qualquer outro empreendimento. Todavia, você é generoso: gosta de sentir que tem bens para ajudar as pessoas que ama.","oraculo.dinheiro.7":"O dinheiro e sua administração são, até certo ponto, um mistério para você que não é nada prático e não sabe o que fazer quando os bens que lhe vêm às mãos são muitos. O dinheiro chegará até você através de fontes imprevistas. Precisa ser mais prático e equilibrado com relação ao seu orçamento.","oraculo.dinheiro.8":"Você fica inteiramente à vontade quando aplica dinheiro ou quando organiza o seu orçamento pois são coisas que lhe parecem naturais. Você tem grandes idéias e costuma julgar as pessoas pela aparência. Isso poderá lhe trazer algumas decepções, já que as coisas nem sempre são o que aparentam. O seu desejo de conseguir dinheiro é, até certo ponto, uma garantia de que o terá em bom volume.","oraculo.dinheiro.9":"Você detesta ficar sem dinheiro. De certo modo, a falta de dinheiro o leva a perder a confiança em si mesmo. Você precisa de dinheiro para realizar os seus planos e revelar a sua verdadeira personalidade. Você sempre deseja muito dinheiro e quase sempre o consegue.","oraculo.dinheiro.11":"Se o onze é o seu número, você gosta de conseguir dinheiro de modo pouco usual e é estranhamente influenciado pelo que os outros pensam de você. Na verdade, sua necessidade de dinheiro vem da importância que você atribui à impressão que pode causar aos outros. Como os outros o vêem é muito importante para o seu sentimento de segurança. Você terá oportunidade de ganhar mais com o desenvolvimento de técnicas já conhecidas e, talvez, de modos pouco ortodoxos na medicina.","oraculo.dinheiro.22":"Você tem uma visão ampla em relação ao dinheiro, considerando o meio adequado de concretizar os projetos, provavelmente no terreno comercial, que é muito favorável a você.\\n\\nDessa maneira, você precisa ser prático e pôr em ordem as suas idéias, de acordo com a realidade, e poder realizar os seus sonhos de sucesso.","oraculo.sucesso.1":"Se o seu número é o UM, você não é o tipo de pessoa que encontra facilidades na vida. Para ser bem sucedido, precisa reformular suas idéias e partir de algo realmente novo.","oraculo.sucesso.2":"Você, do número 2, não é exatamente um lutador. Você gosta muito do lazer e bem-estar. O sucesso, entretanto, poderá chegar para você nos campos da cultura, como música, arte, literatura.","oraculo.sucesso.3":"Você é naturalmente atraído pelo sucesso, mas tendo grande imaginação pode explorar diversos campos para atingir seus objetivos, o que pode significar que você exigirá, excessivamente, dos seus talentos, energias e forças, Assim, é aconselhável que você limite os seus objetivos, e termine um projeto antes de dar início a outro.","oraculo.sucesso.4":"Você pode ser incluído entre as pessoas de grande senso prático. Sempre que se trata de ser bem sucedido, você está plenamente em condições de lutar por ele. Sua atitude é sempre realista, mas você poderá levar a conquista do sucesso tão a sério, que pouco tempo lhe restará para a diversão.","oraculo.sucesso.5":"Você é uma pessoa criativa e luta pelo sucesso através do trabalho e do entusiasmo. A livre comunicação de idéias é fundamental para que você seja bem sucedido. Se você tiver bastante sorte poderá se tornar famoso como escritor, jornalista ou comentarista de televisão.","oraculo.sucesso.6":"Você deve conter sua ambição e não esperar sucessos estrondosos. Sua felicidade dependerá do êxito no lar, com a família, e no amor. Se conseguir receber essa bênção, tudo o mais lhe parecerá sem importância. E é provável que isso venha realmente a acontecer.","oraculo.sucesso.7":"Você pretende ser bem sucedido, concretizando os sonhos de um companheiro que partilhe com você ideais, esperanças, alegrias e tristezas. Com um companheiro desse tipo, você atingirá o sucesso. Este é um sonho difícil de se concretizar mas, se você o conseguir, o sucesso chegará a você.","oraculo.sucesso.8":"Sucesso, para você, quer dizer DINHEIRO, e com letras maiúsculas. Suas aspirações estão todas ligadas a coisas materiais, roupas, carros, casas, alimentação requintada e as melhores bebidas e com o dinheiro capaz de assegurar-lhe essas maravilhas. Mas você deve procurar aprender a dividir com outros as coisas boas da vida, pois só assim poderá ser feliz. Você é muito capaz de um grande esforço e, provavelmente, conseguirá ser bem sucedido.","oraculo.sucesso.9":"Se o nove é o seu número, você tem grandes ambições; seu objetivo é conseguir renome internacional. Você coloca muito alto os seus sonhos. Poderá atingir a glória no mundo das diversões, das artes criativas, mas também na dedicação aos ideais humanitários. Você tem condições de fazé-lo.","oraculo.sucesso.11":"Você não gosta dos caminhos já palmilhados e deseja chegar ao sucesso em campos pouco comuns. Na verdade, você não será bem sucedido onde outros já atingiram seus objetivos. Você poderá ser bem sucedido na televisão, em atividades ligadas a computadores, no trabalho PES, no campo do ocultismo, ou em qualquer das técnicas da era moderna.","oraculo.sucesso.22":"Você confia muito em si mesmo e acredita que o sucesso está em sua própria iniciativa, em suas táticas de persuasão e em seu magnetismo. Você poderá ser bem sucedido em qualquer atividade de vendas, onde poderá ter o toque de Midas. Se tiver disposição para começar e recomeçar tudo quantas vezes for necessário, isto é, sempre que perceber que tomou o caminho errado, então o sucesso será seu.","definicao.ambicao":"1. A soma das vogais dá a energia, a ambição, o desejo mais profundo.","definicao.personalidade":"2. A soma das consoantes indica a personalidade, ou a impressão que você causa aos outros.","definicao.expressao":"3. A soma das vogais e das consoantes dá seu número de expressão, ou aquilo que você pode realizar melhor — os caminhos da sua mente.","definicao.realidade":"4. A soma dos números de expressão e do destino dá o número da realidade, ou seu objetivo, em direção ao qual você se esforça durante toda a vida.","definicao.destino":"Obtém-se o caminho do destino, somando o dia, mês e ano do nascimento e reduzindo o total a um único dígito, a menos que se tenha chegado aos números onze e vinte e dois, números principais que não podem ser reduzidos.","oraculo.metodo":"Concentre-se na palavra que você escolheu: AMOR, DINHEIRO ou SUCESSO. Então, escolha três números de 1 a 9 (você poderá incluir, se quiser, o 11 e o 22). Some-os e os reduza a um só dígito, não os reduzindo apenas se a soma der 1 l ou 22. Escolha o seu número de interpretação entre os números de que vamos tratar agora.\\n\\nLembre-se de que, ao iniciar este processo, você deve estar bem relaxado e que a escolha dos três números deve ser livre e espontánea.","elemento.agua":"A Água ou Elemento Científico se encontra nos nascimentos que podem ser reduzidos a 1, 5 ou 7. Uma vez que a água é o elemento da mente, aqueles que nasceram sob esses números exigem uma boa educação. Eles serão bons escritores, engenheiros ou clínicos.\\n\\nA água é o elemento das pessoas que nasceram nos dias 1, 5, 7, 10, 14, 16, 19, 23, 25 e 28 de qualquer mês. As pessoas de número 1 são avançadas, intelectuais, de espírito científico e criadoras. As de número 5 são versáteis, mutáveis e inquietas. As de número 7 são retraídas, cautelosas e observadoras. Em todos esses números, as pessoas são intuitivas.","elemento.fogo":"O Fogo ou Elemento dos Negócios se encontra nos nascimentos que podem ser reduzidos a 2, 4, 8, 11 ou 22. As pessoas nascidas sob esses números são mais bem sucedidas em negócios realizados no campo Humanitário.\\n\\nContudo, músicos e regentes podem, algumas vezes, nascer sob esses números, devido à suas aptidões de regularidade e precisão. Esse elemento representa o sentimento e a emoção. As pessoas nascidas em qualquer desses números têm emoções profundas, mas, incapazes de manifestá-las são, frequentemente, mal compreendidas.\\n\\nO fogo é o elemento das pessoas que nasceram nos dias 2, 4, 8, 11, 13, 17, 20, 22, 26, 29 e 31 de qualquer mês. Eles são bons executivos, banqueiros, comerciantes, secretários, auditores, políticos e inovadores, particularmente os que nascem sob os números 11 e 22.","elemento.ar":"O Ar ou Elemento Artístico se encontra nos nascimentos que podem ser reduzidos a 3, 6 ou 9. São pessoas de temperamento artístico, capacidade literária e criadoras.\\n\\nOs nascidos sob estes números estão sempre lidando com o público, no palco, de preferência. As pessoas nascidas sob essas vibrações, em geral, não têm dificuldades em se expressar de modo criativo.\\n\\nO ar é um elemento espiritual e, dessa maneira, as pessoas influenciadas por ele são cheias de inspiração.\\n\\nO ar é o elemento das pessoas que nasceram nos dias 3, 6, 9, 12, 15, 18, 21, 24, 27 e 30.\\n\\nAs pessoas nascidas sob essa vibração serão bons artistas, escritores, médicos, advogados, conselheiros, filantropos e atores.","elemento.vocacao":"As vibrações de uma data (dia) de nascimento são sempre as mesmas, não importando o ano ou o mês.\\n\\nQuando você interpreta o dia do nascimento, não pode fazer isto isoladamente; deve associá-lo ao número de ambição e ao número de expressão. A influência de todos esses elementos o ajudará a encontrar sua verdadeira vocação.","plano.numero-alto":"A vida nos dá meios de suprir as nossas deficiências. Agimos com facilidade, às vezes até excessiva, nos planos em que dispomos de muitos números. Um número alto, seja em que plano estiver, oferece possibilidades de êxito e sucesso e mostra um raro talento individual, ao longo das linhas do número e em seu plano de expressão.\\n\\nO 5 é uma exceção, pois é um número que está sempre mudando. A ausência de equilíbrio dos números S pode levar ao insucesso, indicando muitos caminhos, mas não possibilitando o domínio de nenhum deles,","plano.emocoes-reprimidas":"Se, nos planos de expressão, você encontrar um 7 ou observar a falta deste número, pode estar certo de que a pessoa analisada é um ser que reprime suas emoções. Isso é nocivo para os nervos, para a saúde e, em geral, dificulta o relacionamento entre os seres humanos. A pessoa que se retrai e teme manifestar suas emoções faz isso porque tem medo de que os seus sentimentos sejam repelidos ou tratados levianamente.\\n\\nExiste uma barreira entre essa pessoa e os outros seres humanos. Arme Louise se tornará solitária e poderá buscar soluções na bebida, nas drogas, na promiscuidade e numa vida que não é sadia.\\n\\nCabe aqui um conselho: \\"Não leve demais a sério os seus sentimentos. Sem dúvida, você está magoada, ferida, mas isso acontece a todos os seres humanos. Não deixe que o orgulho e a frieza de seu coração a transformem numa geladeira\\".","quadro.horizontal":"Você pode observar que, ao longo das colunas horizontais, os números apresentam diferentes graus de valor matemático, guardando uma proporção de 3 em 3. Isso significa muitos problemas e um trabalho árduo para atingir o sucesso.","quadro.vertical":"Ao longo das colunas verticais, os números seguem uma progressão numérica normal. Há uma pequena distância entre eles, indicando que a vida não será muito difícil nem será necessário um grande esforço para atingir o sucesso.","quadro.diagonal":"Na coluna diagonal 1, 5, 9, a distância entre os números é de quatro. Os empreendimentos se concretizarão, até com uma certa facilidade e poucas vezes você precisará demonstrar sua força de vontade, o que não é muito bom, já que ficará na dependência dos outros.","relacao.similares":"Similares: Os similares trazem harmonia nos relacionamentos íntimos. Isto acontece quando o número de ambição e número de destino são iguais.","relacao.complementares":"Complementares: Se os dois números são pares ou se os dois são ímpares, então as duas pessoas se complementarão mutuamente, cada uma contribuindo com o que falta à outra.\\n\\nUma vez que as vibrações são diferentes, este fato constitui uma ajuda muito grande, pois fará com que ambos se complementem pelo ajuste das diferenças.","relacao.opostos":"Opostos: Se os números da ambição ou os de destino são opostos, haverá grande dificuldade de compreensão e os dois, dificilmente, conciliarão seus ideais e interesses. Haverá uma grande atração, uma vez que cada um vê no outro o diferente e o desconhecido. Haverá choques de personalidades.","relacao.soma-expressao":"Nada mais fácil. Basta acrescentar o seu número de expressão ao dessa pessoa e verificar que número resultou dessa soma.\\n\\nPor exemplo, seu número de expressão é 1 e o dela é 9. Você obterá o resultado 1 e saberá que pode trabalhar, estudar, organizar e dar início a um novo projeto em conjunto com essa pessoa.\\n\\nOu então o seu número é 1 e o dela também. Você vai ter o número 2. Provavelmente, se as circunstâncias forem favoráveis, vocês se apaixonarão, casarão e terão vários filhos.","relacao.soma-destino":"O mesmo princípio pode ser aplicado à soma das duas datas de nascimento, dia, mês e ano. A soma dos seus números de nascimento é 6 e a dela 9. Assim, vocês terão o número 6. A compreensão entre vocês será mútua. Lembre-se de que ambos pertencem ao mesmo elemento harmônico, o ar, e, portanto, são semelhantes, Dessa compreensão mútua poderá surgir uma amizade duradoura, uma sociedade, um casamento ou uma simples colaboração. Ambos terão muito o que ensinar um ao outro, o que os levará a desenvolver-se, aperfeiçoar-se e amadurecer.","relacao.analise-completa":"Quando você estiver seriamente interessado, compare os dois mapas e analise tanto os pináculos como os ciclos da vida. Quanto ao restante, se você estiver mesmo interessado, é aconselhável consultar um perito em numerologia que lhe mostrará os prós e os contras.","relacao.paridade":"Os números estão divididos em negativos e positivos, o que o ajudará a conhecer os caracteres das pessoas. Os números pares indicam características positivas, objetivas e, basicamente, extrovertidas. Os números ímpares mostram características negativas, subjetivas, intuitivas, femininas e introvertidas.\\n\\nAssim, quando os números pares predominam no nome e na data de nascimento, indicam um tipo mais negativo, subjetivo e imaginativo. Em poucas palavras, os primeiros, isto é, os números pares, indicam os \\"realizadores\\" e os segundos, os ímpares, os \\"pensadores\\".\\n\\nComo você deve estar percebendo, nós apresentamos as coisas de modo simplificado porque, na realidade, entre o branco e o preto há vários tons de cinza. Isto quer dizer que ninguém é completamente extrovertido ou introvertido. Em geral, o que existe é a tendência para um dos extremos.\\n\\nPor exemplo, uma jovem, predominantemente introvertida, unida a um homem predominantemente extrovertido, teria sérios problemas de comunicação, pondo em perigo a própria ligação entre os dois, a menos que ambos fossem muito cuidadosos.","relacao.casamento":"O 6 é o número do casamento e quando é predominante no mapa, quer como número de expressão quer como número de destino, é difícil saber se a pessoa que está sendo analisada poderá escapar de um casamento precoce. Isso poderia acontecer apenas se houvesse muitos números introvertidos, o que retardaria seu casamento.\\n\\nOs anos importantes para o casamento são aqueles cuja soma dá 3, 5, 6. O último é o ano mais promissor que leva a um futuro estável. O 5 traz uma vibração mais viva, fortes atrativos físicos e, muitas vezes, é responsável por cenas de ciúme.\\n\\nSe uma jovem tem um número de expressão 6, que está também no seu pináculo, e chega a um ano pessoal de número 6, tem todas as possibilidades de casar.\\n\\nPara saber se haverá mais de um casamento, leve em consideração o número de expressão. Se este é um número introvertido, tal como o número do pináculo, haverá menos possibilidades de vários casamentos. No entanto, uma mudança no número do pináculo poderá talvez alterar esse quadro.\\n\\nMuitas vezes as pessoas se casam tarde por já terem outras responsabilidades ou não terem dinheiro ou segurança a oferecer. Para saber o que o futuro lhe reserva é preciso verificar se o seu número de pináculo é 6 ou 2. Se forem esses números, pode-se estar certo de que não ficarão sozinhos nos seus últimos anos de vida.\\n\\nIsto se realizará com mais certeza, ainda, se o número da realidade — que é a soma do número do destino e do número de expressão for 6 ou 2.\\n\\nNa verdade, com um número de realidade 6, um amor profundo e duradouro surgirá apenas bem tarde na vida quando, então, surgirá a pessoa certa.","relacao.mudanca-nome":"Surge, finalmente, a questão: é possível mudar de nome? A resposta é sim, desde que isto possa ajudá-lo a ser bem sucedido em determinado campo. Agora que você já conhece o significado dos números e de suas vibrações, sabe que certos números favorecem os negócios, outros, as atividades criativas. Quem não conhece a história do cantor que ficou no ostracismo, durante dezessete anos, e que, tendo mudado de nome, de repente passou a ter o maior sucesso?\\n\\nSe você quer ser bem sucedido, por exemplo, no campo literário, os números de seu nome devem ser mudados para 3, 6 e 9, mas, se o que deseja é o sucesso nos negócios, deverá introduzir o número 8 no seu nome.\\n\\nContudo, é aconselhável levar em consideração os números de destino e de nascimento. Assim, seria bom consultar um perito em Numerologia quando desejar ou tiver necessidade de mudar de nome. Lembre-se, no entanto, de que esta mudança não vai apagar o número do nome original, pois a sua vibração existirá sempre. O novo nome poderá acrescentar um pouco das qualidades de que você precisa.","ciclos-desafios.nota":"O significado dos ciclos e dos desafios é semelhante. No caso dos desafios indica, por exemplo, que a pessoa que tem um número 3 de desafio deve desenvolver o lado criador e alegre de sua personalidade e manifestar-se de forma criativa. Se não o fizer, não encontrará a felicidade.\\n\\nO mesmo é válido quanto ao significado dos ciclos. Um número de ciclo 4, em um primeiro pináculo, indicará algum trabalho árduo, estudos, dificuldades em relação aos últimos, na escola e na universidade.","realidade.objetivo":"A soma desses dois números mostra em que direção você está trabalhando; esse número faz parte integrante de sua personalidade; sua vibração se intensifica com o tempo e sua influência é mais forte na segunda metade da sua vida.","quadro.exemplo":"Como se pode perceber a um simples olhar, a pessoa nascida nessa data terá vida relativamente fácil. As coisas vêm ao seu encontro; ela não precisa fazer muito esforço para alcançá-las. Mas é exatamente nesta facilidade que está o perigo, pois poderá gastar inutilmente o seu tempo e dinheiro. Observa-se, então, que a própria data do nascimento, somada, dá o número 5, que é o número do esbanjador, que gosta de mudanças e variedade (6 + 2 + 1 + 9 + 5 = 23 = 2 + 3 = 5).","plano.materiais":"1. O 4 e o 5 são números materiais.","plano.emocionais":"2. O 2, o 3 e o 6 são números emocionais.","plano.mentais":"3. O 1 e o 8 são números mentais.","plano.intuitivos":"4. O 7 e o 9 são números intuitivos.","plano.oito":"Já dissemos que o 8 é um número \\"mental\\" associado à conquista de sucesso material, um número extrovertido. Mas isso não facilitará as coisas para Arme Jones porque ela tem um número de expressão introvertido e, provavelmente, não gostará do ruído e do corre-corre diário do mundo comercial.","pinaculos.o-que-sao":"Cada pináculo mostra a atitude e o tipo de experiência que acontecerão durante o seu transcorrer.","pinaculos.duracao":"Vemos, pois, que o primeiro e o último pináculos são os mais prolongados (os outros têm nove anos de duração) e indicam o ambiente e as experiências que vão fazer parte da vida.","ciclos.duracao":"O primeiro ciclo é o número do mês e dura tanto quanto o primeiro pináculo.\\n\\nO segundo ciclo é o número da data de nascimento e tem a duração do segundo e terceiro pináculos, estendendo-se ainda aos nove primeiros anos do quarto pináculo. É chamado o ciclo da produtividade, considerado o mais importante, pois, em geral, é o período mais ativo da vida.","desafios.o-que-sao":"Além dos ciclos, dos pináculos e do número pessoal do ano, que é encontrado somando-se o total do dia e do mês de nascimento ao número universal do ano (soma dos dígitos do ano), temos os \\"pontos fracos\\" da personalidade de uma pessoa, verdadeiras affnadilhas que podem arruinar a sua vida ou afastá-la do sucesso e da felicidade.\\n\\nSão os chamados desafios, encontrados pela subtração dos números de ciclo. Ocorrem simultaneamente com os pináculos.","ano.o-que-e":"A vibração do número de uma pessoa, entretanto, varia a cada dia, como já afirmamos. Essa variação pode ser encontrada somando-se o dia e o mês do nascimento ao número universal do ano.\\n\\nO ano de 1971 foi um ano de número 9, pois 1 + 9 + 7 + 1 = 9. Assim, para achar o número do seu próprio ano que, tomado em conjunto com as indicações do seu nascimento, com as indicações dos pináculos, ciclos e desafios indicará o que você pode esperar desse ano, será preciso: simplesmente somar o dia e o mês do seu nascimento, ao número 9. Uma pessoa nascida a 5 de maio deverá somar 5 + 5 = 1; desse modo, em 1971, ela começou um novo ciclo de vida o que exigiu muita organização e a tomada de importantes decisões que afetariam seu futuro nos nove anos seguintes.","mes.o-que-e":"Podemos também nos voltar para determinado mês e ver o que ele nos promete. Para encontrar o seu próprio mês, some o número do seu ano pessoal ao mês do calendário.","quadro.uso":"Se você já organizou o mapa do seu nascimento e sabe, de um modo geral, se a sua vida vai ser fácil ou difícil, componha, agora, um quadro como o do \\"jogo da velha\\", que todos nós jogamos quando crianças.","ciclos.o-que-sao":"O maior requinte é dado pelo potencial do dia, do mês e do ano do nascimento. São os chamados ciclos, que acrescentam um pouco mais de conhecimento, uma vez que mostram o ambiente e a situação, isto é, o pano de fundo dos pináculos.","futuro.1":"Quando aplicado a acontecimentos futuros, o número l indica novidades, o começo de novos projetos, no terreno pessoal ou dos negócios. Ele é indicativo de sucesso, se o passado for deixado para trás, pois o futuro é um tempo que exige determinação, atividade e coragem.","futuro.2":"Em relação aos acontecimentos futuros, as pessoas de número 2 devem ser prevenidas e cautelosas, esperando para ver, já que o tempo de decisões ainda não chegou.","futuro.3":"Quanto ao futuro, não há obstáculos em seu caminho e a felicidade ronda perto.","futuro.4":"Quanto ao futuro, deverão arrefecer seu ritmo e trabalhar para conseguir mudanças.","futuro.5":"Com relação ao futuro, o melhor para elas é ir em frente, mexer-se, mudar, comunicar-se, investir nos próprios talentos e aproveitar as oportunidades.","futuro.6":"Quanto ao futuro, o número 6 indica que as coisas precisam ser ajustadas no lar e, possivelmente, entre os parceiros, pois ele é um número que governa tanto o casamento quanto o divórcio. 'Não deixe para depois\\" — aconselha este número.","futuro.7":"Quando o 7 é predominante em relação ao futuro, uma aura de autodecepção pode tomar a vida difícil. As amizades não são duradouras e os compromissos não chegam a se concretizar, em conseqüência do constante desejo de autocrítica e de fuga à realidade.","futuro.8":"Quanto ao futuro, o número 8 mostra que o tempo não está para se ficar parado; é necessário trabalhar e assumir responsabilidades para progredir. O casamento, para as pessoas de número 8, é um negócio sério, que tem suas bases nas finanças.","futuro.9":"Em relação ao futuro, o número 9 indica que nada deve ser iniciado; isso seria ocioso, porque, sendo ele o funde um ciclo, tudo o que vier pela frente será novo. O número 9 põe termo a relacionamentos em todas as esferas.","futuro.11":"Quanto ao futuro, o 11 mostra que há um tempo tanto para aprender quanto para ensinar e apresentar idéias, ainda que consideradas progressistas e radicais.","futuro.22":"Quanto ao futuro, o 22 determina: \\"Vá em frente e não deixe que nada o detenha, pois, para construir, muitas vezes é necessário destruir; não tenha receio, pois tudo dará certo\\".","desafio.3":"No caso dos desafios indica, por exemplo, que a pessoa que tem um número 3 de desafio deve desenvolver o lado criador e alegre de sua personalidade e manifestar-se de forma criativa. Se não o fizer, não encontrará a felicidade.","ciclo.4-primeiro":"O mesmo é válido quanto ao significado dos ciclos. Um número de ciclo 4, em um primeiro pináculo, indicará algum trabalho árduo, estudos, dificuldades em relação aos últimos, na escola e na universidade."}`)};function Nn(){if(!Mn.textos||Object.keys(Mn.textos).length<140)throw Error(`A transcrição do livro está incompleta. Execute npm run importar-textos.`);return Mn.textos}var Pn=[[`Início`,[{id:`inicio`,rotulo:`Novo mapa`,render:yn},{id:`mapa`,rotulo:`Mapa completo`,render:Dn,exigeMapa:!0}]],[`Nome`,[{id:`nome`,rotulo:`Análise do nome`,render:Mt,exigeMapa:!0},{id:`frequencias`,rotulo:`Frequência dos números`,render:Pt,exigeMapa:!0},{id:`aptidoes`,rotulo:`Aptidões e ausências`,render:Ft,exigeMap
