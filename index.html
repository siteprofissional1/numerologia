`R-DESTINO`,nome:`Caminho do Destino`,capitulo:3,paginas:`p. 23–30, 45`,classificacao:`explicita`,formula:`D + M + A, cada um reduzido; a soma é reduzida, parando em 11 ou 22.`,exemplo:`06/10/1947: 6 + 1 + 3 = 10 → 1. 04/03/1930: 4 + 3 + 4 = 11`,casosEspeciais:`O mês 10 vale 1; o ano é reduzido pela soma de seus algarismos.`,mestres:`O 11 e o 22 finais não são reduzidos, com leitura opcional 11/2 e 22/4 (p. 23, 29).`,ambiguidades:`Não há exemplo de dia, mês ou ano igual a 11 ou 22 como componente. O aplicativo reduz e avisa quando conservar esses números mudaria o resultado.`,implementacao:`domain/birth-numbers.js: calcularComponentes(), calcularDestino()`},{id:`R-DIA`,nome:`Dia de nascimento`,capitulo:4,paginas:`p. 32–44`,classificacao:`explicita`,formula:`Interpretação indexada pelo dia original de 1 a 31.`,exemplo:`Dia 19 recebe o texto do dia 19, não o genérico do número 1.`,casosEspeciais:`O título "dia 15" entre 17 e 19 (p. 38) é o dia 18.`,mestres:`Dias 11 e 22 têm texto próprio; o dia 22 autoriza reduzir a 4 (p. 40).`,ambiguidades:`Nenhuma além do erro de título.`,implementacao:`data/birth-days.js; domain/birth-numbers.js: calcularDiaNascimento()`},{id:`R-ELEMENTOS`,nome:`Elementos harmônicos`,capitulo:4,paginas:`p. 31–32, 68`,classificacao:`contraditoria`,formula:`Água: 1, 5, 7. Fogo: 2, 4, 8, 11, 22. Ar: 3, 6, 9. Cada dia está em uma lista.`,exemplo:`Dia 28 → 1 → Água; dia 29 → 11 → Fogo`,casosEspeciais:`A lista de dias é igual à obtida pela redução do dia.`,mestres:`11 e 22 pertencem ao Fogo.`,ambiguidades:`A p. 31 inclui o 8 no Fogo; o quadro da p. 68 o omite.`,implementacao:`domain/birth-numbers.js: ELEMENTOS, elementoDoDia()`},{id:`R-QUADRO`,nome:`Quadro numerológico 3×3`,capitulo:6,paginas:`p. 52–53`,classificacao:`explicita`,formula:`Linhas 3 6 9 / 2 5 8 / 1 4 7, preenchidas com os algarismos da data, sem zeros.`,exemplo:`06/02/1950: 6, 2, 1, 9, 5; soma 23 → 5`,casosEspeciais:`Só a data preenche o quadro. Só há leitura para linhas horizontais, verticais e a diagonal 1-5-9.`,mestres:`Não se aplica.`,ambiguidades:`O livro não define o tratamento de repetições nem a diagonal 3-5-7, e a leitura só é exemplificada para a diagonal completa.`,implementacao:`domain/birth-grid.js: calcularQuadro()`},{id:`R-PINACULOS`,nome:`Pináculos`,capitulo:6,paginas:`p. 53–58`,classificacao:`contraditoria`,formula:`Fim do 1º = 36 − N. P1 = D+M; P2 = D+A; P3 = P1+P2; P4 = M+A.`,exemplo:`21/04/1942: fim 31; 7, 1, 8, 11`,casosEspeciais:`Duração: nove anos no texto, usados no mapa; dez idades na tabela da p. 56.`,mestres:`Conservados, reproduzindo o quarto pináculo 11. Para 36 − N com Destino mestre, as duas contas são mostradas.`,ambiguidades:`A p. 53 diz que o primeiro dura nove anos, mas a fórmula e a p. 56 contradizem isso.`,implementacao:`domain/pinnacles.js`},{id:`R-CICLOS`,nome:`Ciclos da vida`,capitulo:6,paginas:`p. 54–56, 58`,classificacao:`explicita`,formula:`C1 = mês, até o fim de P1. C2 = dia, por P2, P3 e nove anos de P4. C3 = ano, pelo restante.`,exemplo:`21/04/1942: 4, 3, 7; o ciclo 7 começa aos 59 (nove anos) ou 61 (tabela da p. 56)`,casosEspeciais:`A idade de troca depende do modo dos pináculos.`,mestres:`Dia, mês ou ano 11/22 são exibidos como X/Y e somados conforme a política.`,ambiguidades:`Não há lista própria de interpretações: a p. 58 diz apenas que o significado é semelhante.`,implementacao:`domain/cycles.js`},{id:`R-DESAFIOS`,nome:`Desafios da vida`,capitulo:6,paginas:`p. 54, 56, 58`,classificacao:`inferida`,formula:`|D−M|, |D−A|, |D1−D2|, |M−A|, com números de um dígito.`,exemplo:`21/04/1942: 1, 4, 3, 3`,casosEspeciais:`Zero é preservado e fica sem interpretação.`,mestres:`Componentes sempre de um dígito ("o mais alto da série mais baixa", p. 56).`,ambiguidades:`A 4ª operação é chamada de "quarto pináculo". Desafio zero não é tratado no livro.`,implementacao:`domain/challenges.js`},{id:`R-ANO-PESSOAL`,nome:`Ano Universal e Ano Pessoal`,capitulo:6,paginas:`p. 54, 58`,classificacao:`explicita`,formula:`Universal = soma dos algarismos do ano, reduzida. Pessoal = D + M + Universal, reduzido.`,exemplo:`05/05 em 1971: 5 + 5 + 9 = 19 → 10 → 1`,casosEspeciais:`O ano consultado é livre e não depende do relógio.`,mestres:`Um dígito como principal, com X/Y registrado; o livro não dá exemplo mestre.`,ambiguidades:`A p. 58 abrevia "5 + 5 = 1" e "1+9+7+1 = 9".`,implementacao:`domain/personal-periods.js: calcularAnoPessoal()`},{id:`R-MES-PESSOAL`,nome:`Mês Pessoal`,capitulo:6,paginas:`p. 58`,classificacao:`ambigua`,formula:`Ano Pessoal + número do mês do calendário, reduzido.`,exemplo:`Ano Pessoal 1: janeiro 1 + 1 = 2; dezembro 1 + 12 = 13 → 4`,casosEspeciais:`Sem fórmula para dia pessoal, apesar de a p. 58 mencionar variação diária.`,mestres:`Um dígito como principal, com X/Y registrado.`,ambiguidades:`O livro não diz se os meses 10, 11 e 12 são reduzidos antes. O dígito final é igual; só o registro de 11/22 pode mudar.`,implementacao:`domain/personal-periods.js: calcularMesPessoal()`},{id:`R-ORACULO`,nome:`Amor, Dinheiro e Sucesso`,capitulo:7,paginas:`p. 59–67`,classificacao:`explicita`,formula:`Três números livres (1 a 9, com 11 e 22 opcionais), somados e reduzidos, sem reduzir 11 e 22.`,exemplo:`5 + 9 + 8 = 22 (fica 22); 7 + 8 + 9 = 24 → 6`,casosEspeciais:`Os números não vêm da data: a escolha espontânea faz parte do método.`,mestres:`Conservados, com leitura própria.`,ambiguidades:`Não há proibição de repetir números; repetir é permitido.`,implementacao:`domain/love-money-success.js`},{id:`R-RELACOES`,nome:`Similares, complementares e opostos`,capitulo:8,paginas:`p. 68–69`,classificacao:`ambigua`,formula:`Mesmo grupo harmônico: similares. Mesma paridade e grupos diferentes: complementares. Paridade e grupos diferentes: opostos.`,exemplo:`6 e 9 (Ar): similares. 1 e 3: complementares. 1 e 2: opostos.`,casosEspeciais:`Só Ambição e Destino são classificados, como no texto da p. 68.`,mestres:`11 é ímpar, mas 2 é par: se as leituras divergem, as duas são mostradas e nenhuma é imposta. O mesmo vale para o 8 fora do Fogo na p. 68.`,ambiguidades:`O texto de "similares" fala em números "iguais"; o quadro, em grupos.`,implementacao:`domain/compatibility.js: classificarPar()`},{id:`R-COMBINACOES`,nome:`Combinação de Expressões e de Destinos`,capitulo:8,paginas:`p. 69`,classificacao:`explicita`,formula:`Somar os dois números e reduzir.`,exemplo:`Expressão 1 + 9 = 10 → 1; 1 + 1 = 2; Destino 6 + 9 = 15 → 6`,casosEspeciais:`Não há percentuais: a autora não os define.`,mestres:`Conservados no registro; o livro não dá exemplo.`,ambiguidades:`Só os resultados 1, 2 e 6 são exemplificados; os demais usam o significado geral.`,implementacao:`domain/compatibility.js: combinarNumeros()`},{id:`R-PARIDADE`,nome:`Positivo e negativo (pares e ímpares)`,capitulo:8,paginas:`p. 70`,classificacao:`contraditoria`,formula:`Contar números pares e ímpares no nome e na data.`,exemplo:`Pares: "realizadores". Ímpares: "pensadores".`,casosEspeciais:`Zeros da data são ignorados, como no quadro.`,mestres:`A contagem usa só valores de 1 a 9.`,ambiguidades:`Uma frase atribui aos pares um tipo "mais negativo"; adota-se a conclusão final do parágrafo.`,implementacao:`domain/name-numbers.js: calcularParidade()`}]),ot=Object.freeze([{id:`I-01`,paginas:`p. 38`,tipo:`Erro editorial`,titulo:`Segundo título "dia 15"`,passagem:`Sequência de títulos: "dia 17", "dia 15", "dia 19".`,problema:`O dia 18 fica sem título, e o dia 15 aparece duas vezes.`,solucao:`O texto entre 17 e 19 é o dia 18; o dia 15 da p. 37 é preservado. Validado por teste.`},{id:`I-02`,paginas:`p. 38`,tipo:`Erro de digitalização`,titulo:`Número de página no meio do texto`,passagem:`"capacidade crítica, como 38 ensaísta"`,problema:`O número da página invadiu a frase do dia 18.`,solucao:`O importador remove o "38" do texto privado.`},{id:`I-03`,paginas:`p. 48 (e p. 50)`,tipo:`Erro matemático`,titulo:`Contagem do 6 em ANNE LOUISE JONES`,passagem:`Tabela: "0 X 6"`,problema:`O nome tem duas letras O, de valor 6. Os "4" emocionais e os "dois números 6" da p. 50 confirmam isso.`,solucao:`O aplicativo faz a contagem verdadeira: 2 × 6.`},{id:`I-04`,paginas:`p. 53, 56`,tipo:`Contradição`,titulo:`Duração dos pináculos intermediários`,passagem:`"terá a duração de nove anos"; tabela "De 32 anos aos 41"`,problema:`De 32 a 41 são dez idades inteiras, e não nove.`,solucao:`Dois modos, identificados: regra textual (32–40, 41–49, 50+) e tabela (32–41, 42–51, 52+).`},{id:`I-05`,paginas:`p. 53, 55–56`,tipo:`Contradição`,titulo:`Duração do primeiro pináculo`,passagem:`O primeiro pináculo "tem uma duração de nove anos"`,problema:`A fórmula 36 − N dá 27 anos ou mais, e a p. 56 diz que o primeiro é dos mais prolongados.`,solucao:`Prevalece 36 − N, usada no exemplo resolvido.`},{id:`I-06`,paginas:`p. 54–56`,tipo:`Contradição`,titulo:`Redução versus quarto pináculo 11`,passagem:`"deve ser reduzido a um só dígito"; "4 + 7 = 11 para encontrar o quarto pináculo"`,problema:`A regra geral destruiria o 11 mostrado no exemplo.`,solucao:`Pináculos conservam 11 e 22.`},{id:`I-07`,paginas:`p. 56`,tipo:`Erro de terminologia`,titulo:`Quarto desafio chamado de pináculo`,passagem:`"encontrará o quarto pináculo"`,problema:`A seção é sobre desafios, e a tabela lista 3 como quarto desafio.`,solucao:`Implementado como quarto desafio, |M − A|.`},{id:`I-08`,paginas:`p. 56`,tipo:`Erro editorial`,titulo:`Subtração com sinal e redação truncada`,passagem:`"3 — 4 = 1", "3 — 7 = 4"; "Subtraia o dia e o mês do nascimento do primeiro desafio"`,problema:`As contas literais dariam −1 e −4, e a frase inverte a operação.`,solucao:`Valor absoluto, apoiado em "sempre o mais alto da série mais baixa".`},{id:`I-09`,paginas:`p. 58`,tipo:`Erro editorial`,titulo:`Abreviações do exemplo de 1971`,passagem:`"1 + 9 + 7 + 1 = 9"; "5 + 5 = 1"`,problema:`As somas reais são 18 → 9 e 5 + 5 + 9 = 19 → 10 → 1.`,solucao:`O aplicativo mostra todas as etapas.`},{id:`I-10`,paginas:`p. 31, 68`,tipo:`Contradição`,titulo:`O 8 no elemento Fogo`,passagem:`p. 31: "2, 4, 8, 11 ou 22"; p. 68: "2.4.11.22"`,problema:`O quadro da p. 68 omite o 8, deixando-o sem grupo.`,solucao:`Elemento do dia segue a p. 31. Na comparação, a divergência é mostrada quando muda a classificação.`},{id:`I-11`,paginas:`p. 70`,tipo:`Contradição`,titulo:`Natureza dos números pares`,passagem:`Pares: "positivas"; depois, pares predominantes: "tipo mais negativo, subjetivo"`,problema:`Duas descrições opostas no mesmo trecho.`,solucao:`Mostrada a contagem e a conclusão final ("realizadores" e "pensadores"), com aviso.`},{id:`I-12`,paginas:`p. 46–47`,tipo:`Particularidade`,titulo:`Intermediário 22/4 da Ambição`,passagem:`"6 + 5 + 11 = 22 = 4"; "número de ambição 22/4"`,problema:`A soma bruta 40 → 4 não passa por 22; só a soma por palavra o revela.`,solucao:`Os dois caminhos são calculados e o 22/4 é exibido.`},{id:`I-13`,paginas:`p. 17, 23, 54, 59`,tipo:`Contradição`,titulo:`Uso desigual dos números mestres`,passagem:`p. 17: "reduzidos a um único dígito"; p. 23: "não podem ser reduzidos"`,problema:`Cada operação segue uma política própria.`,solucao:`Regra específica por operação, documentada em REGRAS_COM_FONTES.`},{id:`I-14`,paginas:`p. 56`,tipo:`Lacuna`,titulo:`Desafio zero`,passagem:`Sem passagem correspondente`,problema:`A subtração pode dar 0, mas não há texto para isso.`,solucao:`O zero é preservado, sem interpretação.`},{id:`I-15`,paginas:`cap. 8`,tipo:`Lacuna`,titulo:`Percentuais de compatibilidade`,passagem:`Sem passagem correspondente`,problema:`Não existe fórmula de percentual.`,solucao:`O aplicativo não calcula percentuais nem probabilidades.`},{id:`I-16`,paginas:`p. 6, 20, 48`,tipo:`Lacuna`,titulo:`Predominância geral de um número`,passagem:`"sendo este número predominante em seu mapa"`,problema:`Não há algoritmo para determinar a predominância.`,solucao:`Mostram-se só os mais frequentes, sem índice inventado.`},{id:`I-17`,paginas:`p. 53, 55`,tipo:`Lacuna`,titulo:`36 − N com Destino 11 ou 22`,passagem:`"subtraindo o número de destino do número 36"`,problema:`N pode ser literal (25, 14) ou reduzido (34, 32).`,solucao:`As duas contas são mostradas; o mapa usa o número literal.`},{id:`I-18`,paginas:`p. 17, 18, 46`,tipo:`Erro editorial`,titulo:`Letras omitidas nos diagramas`,passagem:`"HARVE", "WEI"; consoantes de JONES sem o último 1`,problema:`Faltam Y, R e S nos desenhos, embora as somas 28, 14 e 7 os incluam.`,solucao:`O cálculo usa a grafia integral (HARVEY, WEIR, JONES).`},{id:`I-19`,paginas:`p. 19`,tipo:`Erro editorial`,titulo:`Rótulo trocado de David Weir`,passagem:`"o número de ambição, 5"`,problema:`O 5 é a Expressão de David; a Ambição é 6.`,solucao:`Registrado; não afeta o cálculo.`},{id:`I-20`,paginas:`p. 20–21`,tipo:`Contradição`,titulo:`Faltas de David Weir`,passagem:`"os números 2, 3 e 7 não são supridos"; "o 5 também é o seu número de expressão"`,problema:`O 5 é citado como se faltasse, mas David tem dois. O 8 é suprido pelos 4 na p. 21, e pela posição principal na conta.`,solucao:`A lista de não supridos (2, 3, 7) é reproduzida pelas posições principais. Regra inferida.`},{id:`I-21`,paginas:`p. 50`,tipo:`Erro editorial`,titulo:`Rótulos trocados no mapa de Anne`,passagem:`"um número de expressão, 4"; "dois números 6 no seu plano material"`,problema:`O 4 é a Ambição, e o 6 pertence ao grupo emocional (p. 47).`,solucao:`Mantidos os grupos da p. 47 e a posição correta.`},{id:`I-22`,paginas:`p. 49`,tipo:`Ambiguidade`,titulo:`"Um 7" nos planos`,passagem:`"encontrar um 7 ou observar a falta deste número"`,problema:`Não está claro se é exatamente um 7. Na prática, a regra cobriria quase todos os nomes.`,solucao:`A nota aparece com zero ou um 7, acompanhada do aviso de ambiguidade.`},{id:`I-23`,paginas:`p. 58`,tipo:`Lacuna`,titulo:`Variação diária`,passagem:`"varia a cada dia, como já afirmamos"`,problema:`Não foi afirmado antes, e não há fórmula de dia pessoal.`,solucao:`Dia pessoal e horário pessoal não são implementados.`},{id:`I-24`,paginas:`p. 68`,tipo:`Ambiguidade`,titulo:`Definição de similares`,passagem:`"quando o número de ambição e número de destino são iguais"`,problema:`O quadro define similares por grupo, e a p. 69 trata 6 e 9 como semelhantes, sem serem iguais.`,solucao:`Adotado o grupo, com a igualdade exata indicada à parte.`},{id:`I-25`,paginas:`p. 68`,tipo:`Lacuna`,titulo:`Paridade dos números mestres`,passagem:`"Dois números, um par e outro ímpar"`,problema:`11 é ímpar, mas se reduz a 2, que é par.`,solucao:`Havendo divergência, as duas leituras são mostradas.`},{id:`I-26`,paginas:`cap. 1`,tipo:`Contradição`,titulo:`Afinidades assimétricas`,passagem:`O 1 lista o 4; o 4 lista apenas 2 e 8`,problema:`As listas não são recíprocas.`,solucao:`A comparação mostra a direção: quem lista quem.`},{id:`I-27`,paginas:`p. 54–56`,tipo:`Lacuna`,titulo:`Terceiro ciclo fora da lista`,passagem:`A p. 54 define só o primeiro e o segundo ciclos`,problema:`O terceiro aparece apenas na p. 56.`,solucao:`Implementado conforme a p. 56.`},{id:`I-28`,paginas:`p. 46–49`,tipo:`Erro de digitalização`,titulo:`Erros recorrentes de leitura`,passagem:`"Arme" por Anne; "tomar" por tornar; "funde" por fim de; "S" e "l" por 5 e 1`,problema:`O PDF traz erros típicos de OCR.`,solucao:`A transcrição os preserva sem corrigir.`},{id:`I-29`,paginas:`p. 57`,tipo:`Erro provável`,titulo:`Pináculo 11, "dos da infância"`,passagem:`"assim como dos da infância"`,problema:`A expressão é obscura e pode ser erro de digitalização.`,solucao:`A transcrição a mantém, sem correção por conjectura.`},{id:`I-30`,paginas:`p. 54`,tipo:`Erro de digitalização`,titulo:`"affnadilhas" em vez de "armadilhas"`,passagem:`"verdadeiras affnadilhas"`,problema:`A palavra não existe; o contexto indica "armadilhas".`,solucao:`A transcrição conserva "affnadilhas", exatamente como no PDF.`}]),st=Object.freeze({1:`O sentido dos números`,2:`Palavras e números`,3:`Os padrões de seu destino`,4:`O significado das vibrações do seu nascimento`,5:`Como organizar e analisar o seu mapa numerológico`,6:`O que lhe reserva o futuro`,7:`Amor, dinheiro e sucesso`,8:`O amor sem lágrimas`});function A({chave:t,capitulo:n,paginaInicial:r,paginaFinal:i=r,categoria:a,numero:o,interpretacao:s,observacaoEditorial:c=null,...l}){return Object.freeze({chave:t,obra:`${e.titulo} (${e.editora})`,capitulo:n,tituloCapitulo:st[n],paginaInicial:r,paginaFinal:i,categoria:a,numero:o,interpretacao:s,observacaoEditorial:c,tipoTexto:`resumo-fiel`,...l})}var j=(e,t,n,r,i=null)=>A({chave:`dia.${e}`,capitulo:4,paginaInicial:t,paginaFinal:n,categoria:`dia-de-nascimento`,numero:e,titulo:e===1?`Nascido no dia 1º`:`Nascido no dia ${e}`,interpretacao:r,observacaoEditorial:i}),M=Object.freeze({1:j(1,32,32,`Líder nato, de personalidade forte e independente, que abre o próprio caminho e não gosta de críticas. Bom raciocínio e organização, com necessidade de ser pioneiro e inovador; atenção ao ciúme e ao autoritarismo.`),2:j(2,33,33,`Diplomata nato, que rende mais em equipe; aprecia música, dança e as coisas belas da vida. Muito sensível ao ambiente e sujeito à depressão; valorizando-se mais, terá sucesso nos campos artístico e financeiro.`),3:j(3,33,33,`Muito bem dotado, precisa de um meio de se exteriorizar; amigos e vida social são essenciais. Inteligência arguta e imaginação favorecem conferências, escrita, ensino e jornalismo, com realização no campo intelectual e artístico.`),4:j(4,33,33,`Firme e por vezes obstinado, avesso a mudar de ideia ou método; prático, sistemático, leal, e fala a verdade mesmo quando desagrada. Emotivo, mas contido, e por isso pouco correspondido. Vai até o fim, com realização nos negócios.`),5:j(5,34,34,`Raciocínio rápido, corpo ágil e versatilidade; detesta restrições e vive intensamente, com muitas viagens. Bom promotor de vendas e adequado a atividades públicas e dinâmicas; cuidado para a independência não criar problemas com o parceiro, e cautela com o sexo oposto.`),6:j(6,34,34,`Apegado ao lar, precisa de companheirismo, amor e encorajamento. Voz agradável e interesse por artes e música; idealista, sai-se bem em grupos e negócios comunitários, sobretudo em beleza, saúde, música e teatro. Em más condições, o jovem pode perder a confiança na vida.`),7:j(7,34,35,`Introspectivo, tranquilo e analítico, busca a perfeição e é difícil de conhecer. Interesse por ciência e ocultismo, com sensibilidade e intuição; custa a encontrar parceiro por não se adaptar facilmente. Sucesso em atividades de especialização.`),8:j(8,35,35,`Lugar natural no mundo dos negócios: bom senso, equilíbrio e autoridade. Indica dinheiro, mas pode exigir luta se outros fatores do mapa forem desfavoráveis; gosta de poder e status e precisa de uma estrutura organizada.`),9:j(9,35,35,`Inteligência e criatividade abrem muitas atividades; vibração universal, com viagens ou muita comunicação. Impressionável, generoso e protetor, deve cuidar para não se dar à pessoa errada; pode alcançar fama no campo artístico ou profissional.`),10:j(10,36,36,`Nasceu para dirigir e ser independente: os outros é que se apoiam nele. Não deve trabalhar subordinado; pode seguir vários caminhos desde que à frente, cultivar as artes e ter sucesso em atividades individuais pela sua determinação.`),11:j(11,36,36,`Número fundamental, de grandes ideais. A dificuldade é deixar a razão se sobrepor à intuição, quando deveria segui-la, pois é sensitivo. Vive em alta vibração e com nervos à flor da pele, e por isso controle e meio-termo são indispensáveis.`),12:j(12,36,37,`Cordial e amistoso, com inteligência prática e talento literário ou artístico; em ambiente estimulante, é ótimo companheiro e perito em vendas e propaganda. Problemas no amor e na amizade o entristecem; indicado para diversões e literatura.`),13:j(13,37,37,`Muitas vezes começa com o pé esquerdo e parece áspero e ditatorial, por dificuldade de expressar sentimentos. Ambicioso e trabalhador, gosta de organizar; atento a detalhes, ciência e mecânica. Convém expressar-se mais e cultivar um hobby como entalhe ou escultura.`),14:j(14,37,37,`Versátil, de natureza dupla, lógica e imaginativa; pode construir ou destruir, com um pé na terra e outro no céu. Gosta do novo e da variedade, mas o excesso de experiências prejudica: para vencer, precisa de estabilidade na profissão.`),15:j(15,37,37,`Cooperativo, generoso e simpático, gosta de ajudar e de assumir responsabilidades, mas não deve ficar em meio que o reprima, pois isso afeta saúde e bem-estar. Precisa de lar harmonioso e de companheiro que o deixe ser quem é; sucesso no campo artístico e profissional.`),16:j(16,38,38,`Número espiritual, que dá mais importância ao espiritual do que ao terreno, embora a inteligência prática e inventiva possa render nos negócios. Perfeccionista, irrita-se e deprime-se se não atinge a perfeição; deve desenvolver aptidões literárias, artísticas e musicais.`),17:j(17,38,38,`Variações marcantes de humor; família e pessoa amada são muito importantes, com sensibilidade emocional na vida privada e nos negócios. Grande número para as finanças: tomar as decisões grandes e delegar as pequenas.`),18:j(18,38,38,`Independente, eficiente e líder nato, fascinado pelo mundo intelectual, em que sabe se expressar. Lado emocional e sensível, amante da música, porém muito contestador; a capacidade crítica serviria bem ao ensaísta ou escritor. Vida ativa e com muitas viagens.`,`Correção editorial: na p. 38 esta seção aparece com o título "Nascido no dia 15", entre os dias 17 e 19. O título correto é "Nascido no dia 18". O dia 15 original está na p. 37 e foi mantido.`),19:j(19,38,39,`Radical nas atitudes, com humor que percorre toda a escala de 1 a 9; vive à beira do precipício, mas tem imensos recursos. Com versatilidade e ideias originais não passará necessidade; deve fazer das mudanças uma constante e escolher com cuidado o companheiro, pois o casamento pode trazer muitos problemas.`),20:j(20,39,39,`Acima de tudo emocional, precisa de amigos, camaradagem e apoio, e de segurança no lar. Compreensão de detalhes e talentos musicais ou artísticos; não deve se deixar dominar pelas emoções, sob pena de parecer volúvel.`),21:j(21,39,40,`Precisa se expressar na literatura e nas artes para ser feliz; cauteloso e encantador, mas individualista. Fazer muitas coisas ao mesmo tempo dispersa suas forças. Emocionalmente instável, prefere receber a dar no amor; sucesso no mundo literário e bom anfitrião.`),22:j(22,40,40,`Número principal: pode sentir-se feliz ou infeliz conforme encara as coisas. Causas humanitárias e movimentos de ajuda combinam com ele; horizontes amplos pedem coragem para manter os olhos nos ideais e os pés na terra. Se não estiver preparado, pode reduzir a 4 e orientar-se por ele.`),23:j(23,40,40,`Independente, autossuficiente, orgulhoso e responsável, com raciocínio rápido e notável análise para diagnosticar problemas de uma organização. Mais sucesso com o sexo oposto e com pessoas mais velhas; adapta-se a mudanças e serve a negócios, diversões ou medicina.`),24:j(24,41,41,`Energia surpreendente e necessidade de movimento; assume responsabilidades, sobretudo na família e na comunidade. Pode ficar ansioso com o receio de não realizar o que considera certo; atingirá os objetivos com trabalho árduo, possivelmente na educação.`),25:j(25,41,41,`Intuitivo e inspirado, oculta pensamentos e é mal compreendido; o sucesso é indispensável à autoestima, e padrões de perfeição o deprimem. Inclinado a atividades criativas como vendas; deve desenvolver a concentração e prefere a vida simples do campo à cidade.`),26:j(26,41,42,`Ama acima de tudo o lar e os filhos, mas pode ir muito bem nos negócios, por ser organizador e executivo. Começa com entusiasmo e precisa de persistência para terminar. Forte orgulho de status: o casamento só é aconselhado com dinheiro; não remoer o passado.`),27:j(27,42,42,`Força, determinação e altos ideais fazem dele um líder natural, inadequado a posições subalternas ou sociedades meio a meio. Muito a dar em amizade e casamento; sexto sentido forte, atraído por metafísica e filosofia. Controlar a introversão quando algo dá errado; atividade literária ou artística.`),28:j(28,42,42,`Caráter forte, que prefere o anticonvencional dentro do convencional; dominante, independente e ambicioso, deve atuar com autonomia dentro de um grupo organizado. Sonha, luta pelos ideais e perde o interesse ao atingi-los; valoriza a liberdade e o inusitado.`),29:j(29,43,43,`Grande aniversário, que tende a levar ao público: intuitivo, idealista e com liderança. Inclinado à melancolia e à volubilidade, vive numa gangorra emocional e não é de convívio fácil; precisa de válvula artística ou dramática, como escrita ou música.`),30:j(30,43,43,`Imaginação privilegiada, caminho para a autorrealização; teatro e literatura são meios naturais, e nunca deve prender-se à rotina. Ideias arraigadas tornam inútil discutir, mas é bom amigo e popular. Atraído pelo trabalho social e pelas artes; a precipitação pode dispersar energias.`),31:j(31,44,44,`Construtivo, capaz de trabalho duro e continuado; leal, mas pode ser obstinado. Precisa do apoio de uma família bem constituída, aprecia viajar e deve ter ambições razoáveis. Conhecimento natural de drogas e ervas e interesse pela saúde; sucesso se construir sobre alicerces sólidos.`)}),N=(e,t,n,r,i,a=null)=>A({chave:`destino.${e}`,capitulo:3,paginaInicial:n,paginaFinal:r,categoria:`caminho-do-destino`,numero:e,tema:t,interpretacao:i,observacaoEditorial:a}),ct=Object.freeze({1:N(1,`O Pioneiro`,24,24,`Caminho original e independente, com as próprias decisões no comando; percepção aguda, concentração e ideias criadoras abrem perspectivas de sucesso. Evitar tanto a preguiça e a indecisão quanto a dominação e o egoísmo.`),2:N(2,`Cooperação`,24,24,`A vida pede tato e diplomacia: ajudando e cooperando se obtém o que se deseja, e o próprio sucesso depende do sucesso dos outros. Paciência, atenção aos detalhes e cuidado com mudanças; evitar mau humor, emotividade excessiva e indiscrição.`),3:N(3,`Auto-expressão`,25,25,`Oportunidades de se expressar, por escrita, fala ou outro meio criativo; a missão é transmitir alegria, cultivar amizades e desenvolver os poderes de criação. Evitar autoritarismo, presunção, pessimismo, sarcasmo e cinismo.`),4:N(4,`Organização Prática`,25,25,`Vida de trabalho constante: mesmo a riqueza só vem pelo esforço, e pode haver períodos de economia e deveres, às vezes por causa da saúde. O número é um alicerce: as coisas chegam devagar e exigem paciência, responsabilidade e eficiência.`),5:N(5,`Experiência e Mudança`,25,26,`Caminho de liberdade, variedade, viagens e adaptação; nada se mostra permanente, mas não se deve mudar só pelo prazer de mudar. Aprender línguas, acompanhar o mundo e progredir sem negligenciar as raízes; evitar a fantasia e a autoindulgência, cuidar das finanças.`),6:N(6,`Responsabilidade/Serviço`,26,27,`Nasceu para confortar, conciliar e ajustar o que está em desarmonia, servindo com amor no lar e na comunidade; o destino sempre traz responsabilidades e angústias alheias. Pode falhar ao recusá-las ou ao ser dominador, possessivo e tornar os outros dependentes.`),7:N(7,`Análise/Sabedoria`,27,27,`Caminho do pensador e filósofo: descobrir a verdade sob as aparências, trabalhar nos bastidores e aprender a ficar só, pois as respostas vêm do silêncio e do próprio íntimo. O medo do fracasso e da solidão complica as coisas; o sucesso vem da especialização.`),8:N(8,`Dinheiro/Poder Comercial`,27,28,`Atenção a valores comerciais e ideias financeiras práticas; número de força, organização e independência material, destinado a cargos de direção. Exige muito trabalho e discernimento; o grande sucesso vem ao aceitar outros valores além dos comerciais e agir pelo bem da comunidade.`),9:N(9,`Amor Universal/Serviço`,28,29,`Exige atitude aberta, compaixão, compreensão e vontade de servir, com objetivos amplos, inclusive em entidades humanitárias e movimentos internacionais. Sucesso e felicidade vêm de vencer preconceitos e tratar os outros como gostaria de ser tratado, vivendo conforme os ideais.`),11:N(11,`Número principal`,29,29,`Quem não quer viver sob sua forte influência pode reduzi-lo a 2 e ler esse caminho. Quem quer explorá-lo deve confiar na intuição e levar a inteligência inventiva a terrenos práticos; encontrará oposição e correntes místicas, e vencerá passando de sonhador excêntrico a lutador crítico, com atitude filosófica.`,`Leitura 11/2 autorizada pela p. 23 e p. 29.`),22:N(22,`Número principal`,29,30,`Pode ser reduzido a 4 e lido por esse caminho. Para viver todo o potencial, unir ideais e aptidões práticas em um esquema amplo, ligado a bem-estar social, saúde e movimentos espirituais. O sucesso vem de ver as ideias como um todo, deixar os detalhes a outros e construir superando obstáculos.`,`Leitura 22/4 autorizada pela p. 29.`)}),lt=(e,t,n,r)=>A({chave:`elemento.${e}`,capitulo:4,paginaInicial:t,paginaFinal:n,categoria:`elemento-harmonico`,numero:null,...r}),ut=Object.freeze({agua:lt(`agua`,31,31,{interpretacao:`Elemento da mente: exige boa educação. Pessoas intuitivas; o 1 é avançado, intelectual e criador, o 5 é versátil e inquieto, o 7 é retraído, cauteloso e observador.`,aptidoes:`Bons escritores, engenheiros ou clínicos.`}),fogo:lt(`fogo`,31,32,{interpretacao:`Elemento do sentimento e da emoção: emoções profundas, mas difíceis de manifestar, e por isso frequentemente mal compreendidas. Maior êxito em negócios no campo humanitário.`,aptidoes:`Direção de empresas, bancos, comércio, secretariado, auditoria e política; inovação, em especial nos números 11 e 22; às vezes música e regência, pela regularidade e precisão.`,observacaoEditorial:`O quadro da p. 68 omite o 8 do Fogo, embora a p. 31 o inclua. O aplicativo segue a p. 31 e avisa quando isso muda uma classificação.`}),ar:lt(`ar`,32,32,{interpretacao:`Elemento espiritual e cheio de inspiração: temperamento artístico, capacidade literária e facilidade de se expressar criativamente, em geral lidando com o público.`,aptidoes:`Arte, escrita e atuação; também medicina, advocacia, aconselhamento e filantropia.`})}),dt=A({chave:`elemento.vocacao`,capitulo:4,paginaInicial:32,categoria:`elemento-harmonico`,numero:null,interpretacao:`O dia de nascimento não deve ser interpretado sozinho: associado à Ambição e à Expressão, ajuda a encontrar a vocação. As vibrações do dia são as mesmas em qualquer mês ou ano.`}),ft=(e,t,n,r,i=null)=>A({chave:`plano.${e}`,capitulo:5,paginaInicial:47,paginaFinal:51,categoria:`plano-de-expressao`,numero:n,nome:t,interpretacao:r,observacaoEditorial:i}),P=Object.freeze({materiais:ft(`materiais`,`Materiais`,[4,5],`Grupo dos números 4 e 5 (p. 47). O 5 é a exceção entre os números altos: está sempre mudando, e sua falta de equilíbrio indica muitos caminhos sem domínio de nenhum (p. 48).`),emocionais:ft(`emocionais`,`Emocionais`,[2,3,6],`Grupo dos números 2, 3 e 6 (p. 47). No exemplo de Anne, o 6 aparece ligado a responsabilidade, voz e capacidade de atrair amor e amizade (p. 50–51).`),mentais:ft(`mentais`,`Mentais`,[1,8],`Grupo dos números 1 e 8 (p. 47). O 8 é descrito como número mental e extrovertido, associado à conquista de sucesso material (p. 50).`),intuitivos:ft(`intuitivos`,`Intuitivos`,[7,9],`Grupo dos números 7 e 9 (p. 47). A autora só desenvolve aqui o 7: encontrá-lo ou notar sua falta nos planos indica emoções reprimidas (p. 49).`)}),F=Object.freeze({oito:A({chave:`plano.oito`,capitulo:5,paginaInicial:50,categoria:`plano-de-expressao`,numero:8,interpretacao:`O 8 é número mental e extrovertido, ligado ao sucesso material. No exemplo, isso não facilita a vida de Anne, cuja Expressão é introvertida.`}),numeroAlto:A({chave:`plano.numero-alto`,capitulo:5,paginaInicial:48,categoria:`plano-de-expressao`,numero:null,interpretacao:`Agimos com facilidade, às vezes excessiva, nos planos em que há muitos números; um número alto em qualquer plano oferece possibilidade de êxito e mostra talento na linha desse número. O livro não fixa a partir de que contagem um número é "alto".`}),emocoesReprimidas:A({chave:`plano.emocoes-reprimidas`,capitulo:5,paginaInicial:49,categoria:`plano-de-expressao`,numero:7,interpretacao:`Encontrar um 7 nos planos, ou notar sua falta, indica alguém que reprime as emoções por medo de ser repelido; isso prejudica nervos, saúde e relacionamentos. O conselho é não levar os próprios sentimentos demasiado a sério.`})}),pt=Object.freeze({1:[2,4,7],2:[1,7],3:[6,9],4:[2,8],5:`todos`,6:[6,3,9],7:[1,2,4],8:[2,4,11,22],9:[3,6],11:[2,4,8,22],22:[2,11,8]}),I=(e,t,n,r)=>A({chave:`geral.${e}`,capitulo:1,paginaInicial:t,paginaFinal:n,categoria:`significado-geral`,numero:e,afinidades:pt[e],...r}),L=Object.freeze({1:I(1,6,6,{regente:`Sol`,interpretacao:`Perfil dinâmico, independente, original e criativo, que gosta de realizar e de orientar outras pessoas; associado a coragem, liderança e decisão. O risco está tanto na indecisão e na falta de confiança quanto no excesso: dominação, egocentrismo e intolerância.`,futuro:`Indica novidades e início de projetos; o êxito pede deixar o passado para trás e agir com determinação e coragem.`,cores:`amarelo, ouro, bronze`,dias:`domingo e segunda-feira`}),2:I(2,6,7,{regente:`Lua`,interpretacao:`Gentileza, tato, adaptabilidade e compreensão; valoriza lar, família e harmonia, e obtém as coisas por diplomacia e não por luta. O risco é a passividade, o excesso de tolerância ou de preocupação com detalhes, o mau humor e a oscilação entre contenção e emoção excessiva; precisa de equilíbrio.`,futuro:`Pede prevenção e cautela: é hora de esperar, pois o tempo das decisões ainda não chegou.`,cores:`todos os tons pastéis`,dias:`domingo e segunda-feira`}),3:I(3,7,8,{regente:`Júpiter`,interpretacao:`Número da autoexpressão, com talento para falar e escrever; natureza feliz e otimista, que estimula e entretém, precisa de amigos e vida social e busca o sucesso em teatro, música, canto e outras formas criativas. O risco é reprimir esse potencial, dispersar-se sem objetivo ou cair na presunção, no esnobismo e no cinismo.`,futuro:`Não há obstáculos no caminho, e a felicidade está por perto.`,cores:`todos os tons de violeta e púrpura`,dias:`quinta-feira`}),4:I(4,8,9,{regente:`Urano, em sua órbita mais próxima de Saturno`,interpretacao:`Número da determinação: pessoas sérias, construtivas e afeitas ao trabalho, à rotina e aos detalhes, confiáveis e persistentes, que encaram limites como estímulo. O risco é usar a força de vontade de modo destrutivo, obstinar-se no erro ou tornar-se negligente e incapaz de concentração.`,futuro:`Convém diminuir o ritmo e trabalhar para conseguir mudanças.`,cores:`cinzenta`,dias:`sábado, domingo e segunda-feira`}),5:I(5,9,10,{regente:`Mercúrio`,interpretacao:`Pensa e age depressa, preza a liberdade e a variação e detesta a rotina; afinidade com viagens, vendas, artes criativas e comunicação, além de magnetismo e atração sexual. O risco é usar a facilidade de expressão para enganar, fugir de responsabilidades e tornar-se pessimista ou destrutivo.`,futuro:`Convém avançar e mudar, buscar contato com os outros, apostar no próprio talento e agarrar as chances que surgirem.`,cores:`todas as cores claras e brilhantes`,dias:`quarta-feira`}),6:I(6,10,11,{regente:`Vênus`,interpretacao:`O idealista romântico: afetuoso, atraente, voltado ao amor, à família e ao lar, com senso de beleza, perfeccionismo, ideias conservadoras e capacidade prática de assumir responsabilidades. O sucesso vem do equilíbrio diplomático; o fracasso, de impor ideais, de possessividade, ciúme e interferência na vida alheia.`,futuro:`Há ajustes a fazer no lar e, talvez, entre parceiros; governa tanto o casamento quanto o divórcio, e o conselho é não adiar.`,cores:`azul e rosa`,dias:`sexta-feira`}),7:I(7,11,12,{regente:`Netuno`,interpretacao:`Introvertido, reservado e solitário: o pensador, o místico, o filósofo. Busca paz e crescimento espiritual e pode ser criador e artístico quando usa bem essas características. O lado baixo é ilusório: fuga da realidade, que pode levar a drogas, bebida, promiscuidade e doença.`,futuro:`Uma aura de autodecepção pode dificultar a vida; amizades e compromissos tendem a não se firmar por autocrítica e fuga da realidade.`,cores:`tons pastéis, branco e cinza claro`,dias:`domingo e segunda-feira`}),8:I(8,12,13,{regente:`Saturno`,interpretacao:`Realista, boa organização, energia e ambição, com atração por grandes negócios e olho para o valor real das coisas. Sem ideais e sem atenção ao lado espiritual e emocional, a busca de poder material leva a grandes erros. Precisa de afeto, mas tem dificuldade de expressá-lo; o casamento liga-se à segurança e ao dinheiro.`,futuro:`Não é tempo de ficar parado: o progresso pede trabalho e responsabilidades assumidas. O casamento é assunto sério, com base financeira.`,cores:`todos os tons escuros, do marrom ao preto`,dias:`sábado`}),9:I(9,13,14,{regente:`Marte`,interpretacao:`Fecha o círculo de 1 a 9: energia, impulso, otimismo e generosidade com compaixão, voltados a grandes causas e ao amor por todos. Intuitivo e líder, realiza-se servindo aos outros, com viagens, comunicação e negócios no exterior. Só fracassa se o egoísmo e a estreiteza entrarem em seus pensamentos.`,futuro:`Nada deve ser iniciado: é o fim de um ciclo, e o que vier depois será novo. Encerra relacionamentos em todas as esferas.`,cores:`todos os tons do rosa ao vermelho`,dias:`terça-feira`}),11:I(11,14,15,{regente:`Urano`,interpretacao:`Com o 22, é o de maior vibração: força espiritual, idealismo e visão à frente do tempo, mente inventiva e intuitiva, busca da verdade sem ortodoxia; muitas vezes em solidão. Como a vibração é forte, o fracasso é frequente em quem não a absorve, tornando-se excêntrico, ingênuo e presa de charlatães.`,futuro:`Tempo tanto de aprender quanto de ensinar e apresentar ideias, mesmo as consideradas progressistas e radicais.`,cores:`todos os tons vivos`,dias:`domingo e segunda-feira`}),22:I(22,15,15,{regente:`oitava mais alta do número 4`,interpretacao:`Altíssima vibração: idealismo intelectualizado com enorme potencial de concretização, graças à visão de con culos dividem a vida em quatro grandes fases. Cada um indica a postura e as vivências que marcam aquele período.`),pinaculosDuracao:H(`pinaculos.duracao`,56,56,`O primeiro e o último pináculo são os mais longos, e os do meio duram nove anos. Os longos apontam o ambiente e as vivências que farão parte da vida.`),ciclos:H(`ciclos.o-que-sao`,54,54,`Os ciclos vêm do dia, do mês e do ano de nascimento e refinam a leitura: revelam o ambiente e a situação, como um pano de fundo de cada pináculo.`),ciclosDuracao:H(`ciclos.duracao`,54,54,`O primeiro ciclo acompanha o primeiro pináculo. O segundo, do dia de nascimento, atravessa o segundo e o terceiro pináculos e mais nove anos do quarto; costuma ser a fase mais ativa e produtiva da vida.`),desafios:H(`desafios.o-que-sao`,54,54,`Os desafios são os pontos fracos da personalidade, armadilhas capazes de afastar a pessoa do sucesso e da felicidade. Saem da subtração dos números de ciclo e correm junto com os pináculos.`),ano:H(`ano.o-que-e`,58,58,`A vibração da pessoa varia a cada dia. Para achar o número pessoal do ano, soma-se o dia e o mês de nascimento ao número universal do ano. Lido junto com o nascimento, os pináculos, os ciclos e os desafios, mostra o que esperar daquele ano. No exemplo de 5 de maio, 1971 dá 1: começo de um novo ciclo, com organização e decisões que pesam nos nove anos seguintes.`),mes:H(`mes.o-que-e`,58,58,`Também dá para olhar um mês específico: o número pessoal do mês é o Ano Pessoal somado ao mês do calendário.`)}),bt=Object.freeze({desafio3:A({chave:`desafio.3`,capitulo:6,paginaInicial:58,categoria:`desafio`,numero:3,interpretacao:`Desafio 3: desenvolver o lado criador e alegre e manifestar-se de forma criativa; do contrário, não se encontra a felicidade.`}),ciclo4NoPrimeiroPinaculo:A({chave:`ciclo.4-primeiro`,capitulo:6,paginaInicial:58,categoria:`ciclo`,numero:4,interpretacao:`Ciclo 4 em um primeiro pináculo: trabalho árduo, estudos e dificuldades em relação a eles, na escola e na universidade.`,ob  de número 2, isto é, pessoas que têm o número 2 predominante no seu mapa numerológico podem, em tese, apresentar o que há de melhor em qualidades humanas, como gentileza, tato, adaptabilidade, compreensão e sabedoria.\\n\\nO número 2 é governado pela Lua que toma muito importante para os seus nativos o lar, a família, assim como tranqüilidade e harmonia no relacionamento. As pessoas de número 2 constróem a harmonia e a beleza em seu ambiente; nunca lutam pelas coisas, que lhes chegam às mãos através da gentileza, diplomacia e habilidade em lidar com os outros.\\n\\nAs pessoas de número 2 só falharão se assumirem atitudes negativas, aceitando imposições alheias sem protesto, se forem excessivamente tolerantes, se se preocuparem em demasia com pormenores, não sendo capazes de se adaptar aos outros e acabando por se transformar em pessoas mal-humoradas, irritadiças, que perdem a calma facilmente.\\n\\nCom esta vibração predominante, podem ser ou excessivamente contidas ou excessivamente emocionais. Para conseguir sucesso e felicidade, precisam, pois, chegar a um ponto de equilíbrio. Seu calor humano, simpatia e compreensão exercem grande atração sobre os que se aproximam delas.\\n\\nEm relação aos acontecimentos futuros, as pessoas de número 2 devem ser prevenidas e cautelosas, esperando para ver, já que o tempo de decisões ainda não chegou.\\n\\nAfinidades: 1, 7. Cores: todos os tons pastéis. Dias propícios: domingo e segunda-feira.","geral.3":"O número 3 está sempre ligado à auto-expressão. Assim, se o número 3 for predominante em seu mapa numerológico, você deve sempre tentar expressar-se de modo criativo, pois este número lhe dá talento oratório e literário.\\n\\nO número 3 dá a seus nativos uma natureza basicamente feliz, otimista e despreocupada. Estas pessoas não devem ficar presas à dura realidade da vida, pois o número 3 lhes confere o dom de estimular e entreter as demais pessoas.\\n\\nPara elas é imperiosa a busca de sucesso de modo criador, através do teatro, da música, do canto e de outras formas de criatividade.\\n\\nO número 3 é essencialmente ligado a Júpiter, o planeta da abundância, da alegria e da felicidade; assim, as pessoas desse número têm necessidade de muitos amigos, de contatos variados, de vida social intensa e de um trabalho que lhes permita libertar sua fantasia.\\n\\nAssim, elas só fracassarão se reprimirem seu potencial, se, em vez de serem portadoras de alegria, se transformarem em pessimistas, em desmancha-prazeres. Também poderão falhar se forem inquietas em demasia, não se fixando nunca num objetivo, fator que lhes trará angústia e que poderá causar a própria destruição e a das pessoas que as cercam.\\n\\nA supervalorização das características das pessoas de número 3 também poderá levá-las ao fracasso, já que, nesse caso, tenderão a se autopromover, a se vangloriar e a serem presunçosas em excesso. O esnobismo e o cinismo são qualidades negativas das pessoas de número 3.\\n\\nSe desenvolverem e aplicarem os seus dons, as pessoas de número 3 levarão a felicidade aos outros e também serão felizes porque se realizarão. Quanto ao futuro, não há obstáculos em seu caminho e a felicidade ronda perto.\\n\\nAfinidades: 6, 9. Cores: todos os tons de violeta e púrpura. Dia propício: quinta-feira.","geral.4":"Se você tiver em sua família pessoas em que predominem os números 3 e 4, terá a oportunidade de observar como são diferentes uma da outra, já que estes números são excludentes, apesar de cada um ter muito a dar ao outro.\\n\\nAs pessoas de número 4 são predominantemente decididas e sérias, pois o 4 é o número da determinação, o que as toma fortemente construtivas, criadoras, afeitas ao trabalho e preocupadas com os pormenores. Em contrapartida, poderão ser fortemente destrativas.\\n\\nAs pessoas de número 4 serão bem sucedidas se estiverem preparadas para desenvolver suas habilidades, o que as tornará úteis aos outros. Todos poderão confiar no seu trabalho e habilidade, pois, apoiadas nas suas características, grandes obras poderão ser realizadas. Elas dão grande importância aos pormenores, à rotina e à sistemática do cotidiano. Em contrapartida, detestam as mudanças se não forem avisadas com antecedência. Persistentes, obstinadas e determinadas, acabam realizando o que se propõem.\\n\\nO 4 está relacionado com o planeta Urano, em sua órbita mais próxima de Saturno, sendo, por isso, considerado um número até certo ponto restritivo. Vibra com os elementos terrenos.\\n\\nAs pessoas que sofrem grande influência do número 4 enfrentam sempre limitações e restrições bem definidas, mas sua poderosa força de vontade e determinação, juntamente com sua imaginação criadora, as capacita a ultrapassar os obstáculos e alcançar o sucesso. A luta para elas é um estímulo.\\n\\nEntretanto, poderão fracassar se aplicarem sua força de vontade num sentido puramente destrutivo, revoltando-se praticamente contra tudo, contestando e argumentando contra todos, chegando mesmo a usar a violência para atingir seus fins.\\n\\nComo características negativas, as pessoas de número 4 obstinam-se no erro, não inspiram confiança, podem ser fracas, negligentes e incapazes de concentração. Quanto ao futuro, deverão arrefecer seu ritmo e trabalhar para conseguir mudanças.\\n\\nAfinidades: 2, 8. Cor: cinzenta. Dias propícios: sábado, domingo e segunda-feira.","geral.5":"Quando o número 5 é predominante no mapa numerológico, as pessoas têm rapidez de raciocínio e ação, amor à liberdade, à mudança e à variedade. Elas são verdadeiramente \\"mercuriais\\", de pensamento progressista e detestam sentir-se amarradas à rotina e à monotonia.\\n\\nElas florescem quando as coisas estão caminhando e, em geral, escolhem uma carreira pública, relacionada com viagens, vendas, artes criativas, aventura e comunicação em qualquer de suas formas.\\n\\nO número 5 é governado pelo planeta Mercúrio. Assim, as pessoas desse número têm uma inteligência mais brilhante do que a média e para serem felizes e bem sucedidas costumam usar, construtivamente, sua capacidade criadora. O raciocínio e a comunicação são muito importantes para elas. Entretanto, se fugirem a estas vibrações positivas, aplicarão sua inteligência de modo destrutivo, tornando-se doentias e fazendo os outros infelizes.\\n\\nQuanto às características negativas, as pessoas de número 5 podem ser destrutivas e pessimistas, decepcionantes, vigaristas, usando sua facilidade de expressão para enganar e fraudar as pessoas, o que as torna não inspiradoras de confiança. Quando agem negativamente, fogem a qualquer responsabilidade, saindo sempre pela tangente.\\n\\nO número 5 é também o da atração sexual e do magnetismo. As pessoas desse número, em geral, são fortemente atraídas pelo sexo oposto.\\n\\nCom relação ao futuro, o melhor para elas é ir em frente, mexer-se, mudar, comunicar-se, investir nos próprios talentos e aproveitar as oportunidades.\\n\\nAfinidades: todos os grupos, mas especialmente o seu próprio grupo, isto é, 5. Cores: todas as cores claras e brilhantes. Dia propicio: quarta-feira.","geral.6":"O 6 é o número do idealista romântico. As pessoas de número 6 são simpáticas, atraentes e afetuosas. Aquelas que têm este número predominante em seu mapa numerológico, lutam pelo amor, a família e o lar.\\n\\nEstas pessoas sentem um forte desejo de harmonia e beleza em tomo de si, desde que isto aconteça em seu lar, na sua comunidade ou em seu grupo. São profundamente conservadoras em suas idéias e pontos de vista.\\n\\nPelas suas características, estão sempre à busca da perfeição em tudo que lhes diz respeito e têm o instinto do belo, da cor e da arte.\\n\\nQuando este número é forte, as pessoas são essencialmente práticas, podendo arcar com qualquer responsabilidade, no lar ou, em esfera mais ampla, numa organização ou comunidade.\\n\\nA felicidade para as pessoas de número 6 é, fundamentalmente, a partilha e a harmonia no relacionamento e, por isso, é primordial para elas a escolha cuidadosa de seus parceiros.\\n\\nO 6 é um número governado pelo planeta Vênus, que determina para os seus nativos habilidades artísticas que, frequentemente, se manifestam na decoração do lar, no vestuário ou em qualquer trabalho criativo.\\n\\nO sucesso, para estas pessoas, chega através do equilíbrio diplomático no trato inteligente com os difíceis temperamentos que encontrarão inevitavelmente em seu ambiente, assim como na consumação da sua vontade de serem úteis.\\n\\nO fracasso poderá advir do desejo de impor seus ideais, de uma atitude muito estreita e exclusivista em relação às pessoas que amam, aos amigos e às propriedades. Estes fatores poderão levar a ciúmes, à interferência na vida de outros e a queixas constantes que podem provocar atritos.\\n\\nQuanto ao futuro, o número 6 indica que as coisas precisam ser ajustadas no lar e, possivelmente, entre os parceiros, pois ele é um número que governa tanto o casamento quanto o divórcio. 'Não deixe para depois\\" — aconselha este número.\\n\\nAfinidades: 6, 3, 9. Cores: azul e rosa. Dia propício: sexta-feira.","geral.7":"Enquanto as pessoas de número 6 são essencialmente extrovertidas, precisando sempre de companhia, as de número 7 são introvertidas; são os pensadores, os místicos e os filósofos deste mundo. É compreensível, então, que você, que está sob a vibração do 7, seja uma pessoa silenciosa, reservada e solitária. O individualismo predomina nas pessoas deste número e, mesmo quando sensíveis, pouco se exteriorizam.\\n\\nO número 7 é governado por Netuno, o planeta da inspiração e das fantasias, o planeta dos altos e baixos. Se o número 7 for predominante, as pessoas serão criadoras e artísticas. Todavia, isto só acontecerá se suas características forem usadas positivamente.\\n\\nAs pessoas de número 7 têm a capacidade de ver através das coisas, de chegar a uma realidade mais espiritual e não se adaptam facilmente ao corre-corre do mundo moderno.\\n\\nA paz, a tranqüilidade e a profunda comunhão consigo mesmo são fatores essenciais para estas pessoas alcançarem o sucesso. Os sacrifícios, de qualquer espécie, quando crianças ou adultos, fazem parte de desenvolvimento das pessoas de número 7, que é o algarismo do crescimento espiritual.\\n\\nQuando afirmamos que este número é o dos altos e baixos, os altos representam a introspeção espiritual inspiradora, e os baixos, o lado ilusório, que esconde a realidade.\\n\\nO lado ilusório leva ao desejo de fugir à realidade, o que pode ser feito de vários modos de recusar-se a encarar a si mesmo e aos problemas como realmente são. Essa tendência pode levar às drogas, à bebida, à promiscuidade e à doença.\\n\\nSe os altos predominarem, você poderá ser um místico ou um artista criador e será bem sucedido, seguindo pelos caminhos que você mesmo descobriu dentro de si.\\n\\nQuando o 7 é predominante em relação ao futuro, uma aura de autodecepção pode tomar a vida difícil. As amizades não são duradouras e os compromissos não chegam a se concretizar, em conseqüência do constante desejo de autocrítica e de fuga à realidade.\\n\\nAfinidades: 1, 2, 4. Cores: tons pastéis, branco e cinza claro.\\n\\nDias propícios: domingo e segunda-feira.","geral.8":"As pessoas que sofrem forte influência desse número são realistas, boas organizadoras, enérgicas, ambiciosas e capazes. Sua vibração é terrena e material. Assim elas são frequentemente atraídas por \\"grandes negócios\\" e pelas entidades que os propiciam.\\n\\nAs pessoas de número 8 têm \\"olho clínico\\" que lhes permite perceber o valor real das coisas. São autoritárias, perspicazes e preparadas para trabalhar duro até atingir a meta fixada.\\n\\nQuando estas pessoas lutam apenas pelo poder material, não são bem sucedidas, pois precisam incorporar ideais e o desejo de fazer algo pelos outros, à sua filosofia. Só assim estarão em condições de ultrapassar os obstáculos e decepções que precisarão vencer para realizar seus projetos.\\n\\nSe exigirem demasiado de si mesmo e dos outros, esquecendo o lado espiritual da vida, poderão cometer grandes erros. Serão bem sucedidas quando aplicarem com equilíbrio a justiça e a tolerância e quando não negligenciarem o espiritual e o emocional.\\n\\nO 8 está frequentemente associado ao casamento, pois as pessoas desse número são mais dependentes dos outros do que admitem. Elas precisam de amor e afeição, mas sentem dificuldade em expressar seus sentimentos.\\n\\nO casamento, nesse contexto, está sempre relacionado com a segurança e o dinheiro. O número 8 é governado pelo planeta Saturno que exige dos seus nativos um trabalho constante para alcançar seus objetivos.\\n\\nAs pessoas desse número encontrarão o sucesso no mundo dos negócios e dos valores materiais.\\n\\nQuanto ao futuro, o número 8 mostra que o tempo não está para se ficar parado; é necessário trabalhar e assumir responsabilidades para progredir. O casamento, para as pessoas de número 8, é um negócio sério, que tem suas bases nas finanças.\\n\\nAfinidades: 2, 4, 11, 22. Cores: todos os tons escuros, do marrom ao preto. Dia propício: sábado.","geral.9":"Com este número, fecha-se o círculo de 1 a 9. As pessoas que têm o predomínio do número 9 possuem energia e são impulsivas, otimistas e generosas. Nelas, estes sentimentos estão sempre mesclados com a compaixão. É a vibração da energia do 9 que leva ao amor universal e às grandes causas.\\n\\nVocê, do número 9, jamais será frágil ou fraco e terá sempre a garra necessária para as grandes causas. Fortemente intuitivo e criador, você, entretanto, somente se realizará quando se colocar a serviço dos outros, com tolerância e integridade. Você é um verdadeiro líder; tem a firmeza e a coragem necessárias para afastar os fracassos.\\n\\nO sucesso virá para você se suas características forem aplicadas em áreas que tragam benefícios aos outros. As pessoas de número 9 são impelidas a fazer viagens, empreendimentos no campo das comunicações e negócios no exterior. Nessas áreas, seu impulso, imaginação e desejo de aventura não serão frustrados, e sua vontade de servir aos outros fará com que você se realize plenamente.\\n\\nAs pessoas deste número só fracassarão se permitirem que o egoísmo e a estreiteza se introduzam em seus pensamentos e atitudes. Se esta hipótese ocorrer, a vida lhes cobrará um alto preço.\\n\\nO número 9 está associado ao planeta Marte, que dá a seus nativos personalidade forte, independência e segurança.\\n\\nEm relação ao futuro, o número 9 indica que nada deve ser iniciado; isso seria ocioso, porque, sendo ele o funde um ciclo, tudo o que vier pela frente será novo. O número 9 põe termo a relacionamentos em todas as esferas.\\n\\nAfinidades: 3, 6. Cores: todos os tons do rosa ao vermelho.\\n\\nDia propícia: terça-feira.","geral.11":"Entre os números, o 11 é, como o 22, o de maior poder de vibração. Assim, aqueles que têm o predomínio desse número no seu mapa numerológico, têm força espiritual, são idealistas e visionários, e, estando muito à frente de seu tempo, dificilmente são aceitos ou compreendidos.\\n\\nAs pessoas desse número estão \\"afinadas\\" com as forças superiores. Sua mente é progressista, inventiva e intuitiva. São pesquisadoras, sempre à procura da verdade; não convencionais nem ortodoxas em suas crenças; fazem suas próprias leis e abrem o seu cantinho na vida.\\n\\nAs pessoas de número 11 serão bem sucedidas quando descobrirem, sobre si próprias, sobre os outros e sobre a própria vida, verdades que possam beneficiar toda a humanidade. Muitas vezes ficam sós, porque poucos conseguem seguir sua trilha com dedicação.\\n\\nO número 11 está associado ao planeta Urano. Como a vibração deste número é muito forte, o fracasso pode ocorrer com freqüência já que nem todas têm força suficiente para absorvê-la, transformando-se em excêntricas e ingênuas, presas fáceis de charlatães que prometem um novo paraíso.\\n\\nAs pessoas de número 11 devem ter em mente que as oportunidades estão à sua espera e devem transmitir aos outros, com sua intuição, os valores em que acreditam.\\n\\nQuanto ao futuro, o 11 mostra que há um tempo tanto para aprender quanto para ensinar e apresentar idéias, ainda que consideradas progressistas e radicais.\\n\\nAfinidades: 2, 4, 8, 22. Cores: todos os tons vivos. Dias propícios: domingo e segunda-feira.","geral.22":"Tal como o 11, o número 22 também tem altíssimo poder de vibração. Assim corno o número 11 é a mais alta oitava do número 2, a Lua, o número 22 é a mais alta oitava do número 4.\\n\\nAs pessoas que têm o número 22 predominando em seu mapa numerológico são idealistas e têm um enorme potencial para a concretização dos seus ideais. São idealistas \\"intelectualizadas\\", mas capazes de levar à prática suas idéias porque têm uma visão de conjunto das coisas.\\n\\nAs pessoas de número 22 fracassam e encontram dificuldades apenas quando se perdem nos pormenores e se deixam dirigir por pessoas de visão mais estreita.\\n\\nMuitas vezes, as pessoas influenciadas pelo 22 temem destruir o que outros construíram e receiam fracassar quando, na realidade, devem ter coragem, já que o número 22 favorece a capacidade de elaborar planos, de construir e de criar, devido a sua ampla visão de conjunto. Quanto ao futuro, o 22 determina: \\"Vá em frente e não deixe que nada o detenha, pois, para construir, muitas vezes é necessário destruir; não tenha receio, pois tudo dará certo\\".\\n\\nAfinidades: 2, 11, 8. Cores: amarelo, ouro e azul vivo. Dia propício: segunda-feira.","destino.1":"Este é o número do pioneiro. Assim, seu caminho deve ser original e lhe dar independência. O leme deverá estar em suas mãos e você tomará suas próprias decisões.\\n\\nVocê tem uma percepção aguda, boa concentração, capacidade de ir em frente, vencendo qualquer obstáculo, desde que aplique suas idéias criadoras.\\n\\nEste é um dos números do caminho da vida que abre a seus possuidores perspectivas de sucesso e lhes dá um interesse vital pela existência.\\n\\nEntretanto, você deve evitar viver de modo negativo, ser preguiçoso e indeciso ou, partindo para o outro extremo, ser dominador e egoísta em excesso.","destino.2":"Sua vida o levará a situações em que o tato e a diplomacia são indispensáveis. Você não pode viver sem os outros e compreenderá que, ajudando os outros e cooperando com eles, você terá o que deseja.\\n\\nSua compreensão inata e a consideração que tem pelos outros lhe trarão compensações. Seja paciente e amistoso e ponha sempre o \\"combustível necessário na máquina da vida\\".\\n\\nObtenha informações e esteja preparado para lidar com pormenores a funde ser útil aos outros. Não saia dos caminhos já conhecidos e seja cuidadoso ao introduzir mudanças. O seu sucesso depende do sucesso dos outros, no lar, no grupo e na comunidade.\\n\\nEvite viver negativamente, pois, como conseqüência, você será mal-humorado, muito emocional, mexeriqueiro e indiscreto.","destino.3":"A vida porá em seu caminho oportunidades de auto-expressão. E você poderá aproveitá-las, mesmo que seja apenas dizendo uma palavra encorajadora a seus amigos, parentes e vizinhos.\\n\\nEscreva, fale ou aplique, de qualquer outro modo, seu potencial criador, pois você está destinado a ser um transmissor de alegria ao mundo. Cultive suas amizades e contribua para que os outros fiquem de bom-humor.\\n\\nA vida para você será ampla e bem sucedida, se você souber desenvolver seus poderes de criação. Então, você terá atingido a exuberância e a beleza do mundo que o cerca e de que sua alma tanto necessita.\\n\\nPara evitar traços negativos, não seja autoritário, presunçoso, pessimista, sarcástico e cínico.","destino.4":"Seu destino o colocará sempre numa roda-viva. Mesmo que os outros números do seu destino indiquem riqueza, esta somente será conseguida através de muito trabalho que exigirá atenção constante. Mais do que isso: haverá ocasiões em sua vida em que você precisará fazer uma grande economia e assumir trabalhos e deveres, muitas vezes devido a sua própria saúde.\\n\\nContudo, não dê as costas aos demais, pois sua contribuição aos outros será essencial. O número 4 representa um alicerce e você deve ser paciente, pois sabe quanto trabalho é necessário para tomar este alicerce resistente. As coisas chegam devagar para você.\\n\\nSeja responsável, eficiente e disposto a trabalhar muito, pois só assim você alcançará o sucesso. Não desanime ante os deveres e obrigações, já que você estará preparando o futuro.","destino.5":"Você jamais ficará preso a trilhos, pois o seu caminho é o da liberdade, da mudança, da variedade, das viagens e da adaptação às dificuldades da vida. Este número lhe foi dado para você aprender a caminhar corretamente dentro da liberdade.\\n\\nSempre que você pensar que alguma coisa é permanente, logo em seguida descobrirá que isto não é verdade. Contudo, você não deverá mudar pelo simples prazer da mudança, julgando que a grama do outro lado do muro é sempre mais verde.\\n\\nAprenda línguas estrangeiras, mantenha-se alerta a tudo o que está acontecendo, acompanhe a evolução do mundo, procure novas aventuras e caminhos nunca trilhados e encare as coisas com pureza. Aplique sua capacidade e faça com que as coisas sempre caminhem no sentido de progresso. No mapa numerológico, você é um progressista, mas não negligencie suas raízes.\\n\\nSe você estiver preparado para mudanças e para viver plenamente e se souber enriquecer sua existência com as experiências da vida, então terá seguido totalmente seus padrões.\\n\\nEvite fantasias e a auto-indulgência. Esteja preparado para ser responsável e não se descuide das questões financeiras, pois você terá de lutar para conseguir o dinheiro.","destino.6":"Pelo menos algumas das angústias do mundo também serão suas, pois você nasceu para ser o confortador, o diplomata, aquele que ajusta as situações desarmoniosas. Você deve aprender a servir com amor, com alegria, com eficiência, dentro do lar, onde a felicidade e o conforto de cada um dependem da sua habilidade e sabedoria, num círculo mais amplo ou na comunidade.\\n\\nSem a sua capacidade de amor e a sua simpatia, o mundo, sem dúvida, seria um lugar triste.\\n\\nNão importa o quão independente você seja, seu destino sempre o levará a assumir a responsabilidade e as angústias de outrem, quer no casamento, quer no campo profissional ou comercial.\\n\\nSeu sucesso dependerá do amor com que os outros o encararem, assim como das compensações financeiras que você vier a conseguir.\\n\\nVocê poderá falhar se não aceitar responsabilidades, se for dominador ou possessivo com relação aos outros, tentando forçá-los a aceitar o seu modo de pensar e tornando-os, emocionalmente, dependentes de você.","destino.7":"O seu caminho é o do pensador e filósofo. Você será levado naturalmente ao estudo do porquê das coisas e das teorias, pois sua tarefa é descobrir a verdade disfarçada sob as aparências e, ao fazer isto, adquirir a sabedoria.\\n\\nA correria e os choques da vida moderna não são para você. A sua melhor função é por trás do palco, como um operador isolado. E terá de aprender a ser só, por algum tempo, e a gostar disto, pois essa é uma condição essencial para o seu desenvolvimento interior. Apenas no silêncio você encontrará a resposta para os problemas da vida. Só com a compreensão de que as respostas estão no seu próprio íntimo, você terá condições de ajudar os outros.\\n\\nO secreto, o antigo e o misterioso sempre terão encanto para você, que só terá sucesso quando aprender a agir ouvindo o mais profundo do seu interior. Jamais corra atrás de qualquer coisa. Aceite os seus parceiros de modo filosófico.\\n\\nVocê tornará as coisas difíceis para si mesmo se tiver medo do fracasso e da solidão, se for insensato, mal-humorado e não quiser aprender o segredo da vida. E isto em qualquer área em que você atuar.\\n\\nSeu sucesso virá da especialização e do desenvolvimento de suas habilidades e sabedoria inatas.","destino.8":"Se o 8 está no caminho do seu destino, você deve dar atenção aos valores comerciais, às idéias práticas no terreno financeiro, pois o 8 é um número de grande força, que indica organização, sucesso e independência material. Você poderá ser poderoso e bem sucedido mas, para isso, você deverá estar preparado para trabalhar muito, organizar-se e desenvolver profundamente o seu discernimento.\\n\\nSe você eventualmente encontrar um tipo de vida estreito, sem compensações, é porque negligenciou alguma das recomendações pertinentes ao seu número; se isto acontecer, volte atrás e tome outro caminho. Você está destinado a exercer cargos de direção, a trabalhar com um propósito ou objetivo e a empregar sua energia e ambição de modo construtivo, para o bem da comunidade.\\n\\nSem dúvida você será bem sucedido porque tem equilíbrio, segurança e autocontrole, qualidades muito úteis no campo comercial, financeiro e político. Prosperidade e progresso econômico são palavras-chave no caminho do seu destino. Se você não exagerar e aceitar outros valores além dos puramente comerciais, terá grande sucesso.","destino.9":"Para ser feliz e bem sucedido, com o número 9 no seu destino, você terá de cultivar uma atitude aberta em relação à vida. Terá de esquecer pequenas coisas insignificantes que, frequentemente, incomodam outras pessoas, não permitindo que elas o influenciem, pois seu caminho exigirá compaixão, compreensão e uma grande vontade de servir.\\n\\nVocê poderá tomar o seu objetivo tão amplo quanto possível, associando-se a entidades humanitárias. Os movimentos nacionais e internacionais são regidos, muitas vezes, pelo número 9.\\n\\nVocê julgará que, muitas vezes, está sendo solicitado em excesso para reordenar as coisas que estão fora de rumo; todavia, este é o seu verdadeiro papel, isto é, manter uma visão ampla e grande interesse pelas coisas do mundo.\\n\\nO sucesso e a felicidade estarão ao seu alcance se você for capaz de vencer os preconceitos e tratar os demais exatamente como gostaria de ser tratado.\\n\\nO número 9 não dá só o dinheiro, mas também sabedoria em administrá-lo, já que é um protegido dos deuses, desde que viva de acordo com os seus ideais.","destino.11":"Se você tem o número 11 em seu destino e não deseja viver sob a sua forte influência, basta que você o reduza a 2, lendo assim as linhas do seu destino.\\n\\nEntretanto, se você deseja explorar os altos e baixos do número 11, você deve aprender a confiar na sua intuição, orientando sua inteligência original e inventiva para terrenos práticos, extraindo benefícios de suas idéias.\\n\\nVocê, certamente, não terá uma vida obscura, mas encontrará, durante a sua jornada, várias formas de oposição.\\n\\nCorrentes místicas, com seus adeptos, cruzarão o seu caminho em algumas fases de sua carreira e, quando isto acontecer, você deverá deixar que a intuição o oriente. Isto acontecerá porque você sempre se sentirá atraído pelas coisas incomuns, apesar das conseqüências.\\n\\nPortanto, cuidado.\\n\\nVocê será bem sucedido se adotar uma atitude filosófica diante da vida, deixando-se guiar sempre pela própria luz interior.\\n\\nVocê vencerá as adversidades, desde que permita que as poderosas vibrações do número 11 o transformem de sonhador excêntrico, sem senso prático, em lutador, dotado do espírito crítico e de poder de comando.","destino.22":"Da mesma forma que com o outro número principal, o 11, você poderá reduzir o 22 a 4 e ler o que este número reserva para você.\\n\\nEntretanto, se deseja viver este número em todo o seu potencial, prepare-se para juntar seus ideais e suas aptidões práticas num só esquema idealístico, de amplitude universal. O 22 é um número frequentemente ligado aos esquemas de bem-estar social, às organizações de saúde e aos movimentos espirituais, nos quais uma visão idealística e humanitária está sempre na vanguarda.\\n\\nNa verdade, você nasceu para ser, simultaneamente, um realizador prático e um idealista, capaz de dar forma às suas visões imaginativas e construtivas. As mudanças são o seu ponto forte.\\n\\nEntretanto, só será bem sucedido se encarar as suas idéias como um todo, deixando a outros os pormenores e não permitindo que alguém, preocupado com o onde e o como, o suplante. Você é o construtor e, como tal, deve construir alguma coisa, superando todos os obstáculos.","dia.1":"Você é um líder nato, de personalidade forte e independente. Gosta de abrir o seu próprio caminho e detesta ouvir críticas.\\n\\nVocê não manifesta seus sentimentos de amizade, mas gosta de senti-los nos outros. Você tem tendências intelectuais, mas é prevenido, apto a \\"tocar mais de um instrumento\\". Tem um grande poder de raciocínio e é excelente organizador.\\n\\nAcautele-se contra o ciúme e o autoritarismo.\\n\\nVocê tem necessidade de ser um pioneiro, um inovador.","dia.2":"Você é um diplomata nato; trabalha melhor em equipe do que sozinho.\\n\\nVocê gosta de música, do ritmo, da dança; tem o senso natural da harmonia e é um grande apreciador das coisas boas e belas da vida.\\n\\nVocê está muito sujeito à influência do meio ambiente que pode, inclusive, deformá-lo e deve ter cuidado para não cair em depressão. A subestimação de suas aptidões pode se constituir num sério obstáculo, por isso, valorize-se mais e terá sucesso nos campos artístico e financeiro.","dia.3":"Você é muito bem dotado e, para ser feliz, precisa apenas encontrar um meio de se exteriorizar.\\n\\nA vida social e os amigos são essenciais para você; portanto, lute para conquistar um lugar que favoreça esses laços.\\n\\nDotado de inteligência arguta e grande imaginação, você terá facilidade para fazer conferências, escrever, ensinar e, sem dúvida, encontrará no jornalismo uma boa profissão.\\n\\nSuas melhores realizações se situarão nos campos intelectual, artístico e de criatividade.","dia.4":"Você é uma pessoa firme, determinada e, por vezes, até obstinada. Você não gosta de mudar seu pensamento nem seus métodos, mas suas aptidões o levam para o terreno das coisas práticas, onde você é batalhador, sistemático, leal, consciencioso.\\n\\nVocê diz sempre a verdade, mesmo quando a mesma não é agradável e, por isso, às vezes arranja inimigos.\\n\\nVocê é emotivo, mas está sempre se controlando, e os outros, não percebendo isto, não retribuem seus sentimentos de amizade.\\n\\nVocê sempre vai até o fim. Assim, qualquer trabalho que exija atenção, disciplina e resistência se adaptam perfeitamente a você; todavia, a sua realização está no mundo dos negócios.","dia.5":"De raciocínio rápido e corpo ágil, a versatilidade é a sua característica. Você detesta restrições e rotina.\\n\\nVocê é um entusiasta da vida e a vive intensamente, a cada minuto. As viagens farão parte de sua vida, devido a sua agitação.\\n\\nQualquer trabalho que inicie lhe dará prazer e o seu entusiasmo pelas coisas o transformará num bom promotor de vendas.\\n\\nÉ uma boa coisa manter-se jovem, mas não crie problemas para o seu parceiro, com a sua independência. Com os seus atrativos, você deverá ter cuidado com o sexo oposto, pois pode se machucar.\\n\\nQualquer área de atividade que o coloque à frente do público se adequará às suas características, sempre que houver movimento e ação.","dia.6":"Você é uma pessoa apegada ao lar e, para se realizar plenamente, precisa de companheirismo, de amor e de alguém que o encoraje. Em condições adversas, os jovens nascidos sob esse número podem ter sérios problemas, perdendo a confiança na vida.\\n\\nVocê tem uma voz muito agradável, que pode ser cultivada, além de ser interessado pelas artes e pela música.\\n\\nVocê será sempre bem sucedido em qualquer grupo ou em negócios que envolvam a comunidade, porque é um idealista, uma pessoa que gosta de melhorar as coisas ao seu redor, não importa quais sejam as condições.\\n\\nOs campos da beleza, da saúde, da música e do teatro são os mais indicados para você.","dia.7":"Você é do tipo introspectivo, tranqüilo e analítico. Seu objetivo é sempre a perfeição, isto é, encontrar o que há de melhor nas coisas. Você é exigente e não muito fácil de conhecer, embora seja amistoso quando conhece bem uma pessoa.\\n\\nSeu interesse volta-se para o campo da ciência e do ocultismo. Você tem qualidades mediúnicas, é sensitivo e pode seguir a sua intuição.\\n\\nO difícil para você é encontrar um parceiro, pois além de não se deixar dominar, não se adapta com facilidade aos outros.\\n\\nVocê terá sucesso nas atividades que exigem especialização.","dia.8":"Se você nasceu no dia 8, seu verdadeiro lugar é o mundo dos negócios. Você tem um bom senso inato, é equilibrado e sabe exercer autoridade.\\n\\nO dia do seu nascimento indica dinheiro, mas, se no seu mapa numerológico, outros fatores não forem favoráveis, você precisará lutar contra circunstâncias adversas.\\n\\nVocê gosta do poder, do dinheiro e de status, não se interessando pelas coisas medíocres e procurando estar sempre em evidência.\\n\\nPara ser bem sucedido, precisa se organizar, pois as suas forças só se desenvolverão totalmente dentro de uma estrutura organizada.","dia.9":"Dotado tanto de inteligência quanto de atividade criadora, uma grande gama de atividades está a sua espera. Sendo o 9 um número de vibração universal, provavelmente haverá muitas viagens em sua vida ou, pelo menos, muitas oportunidades de comunicação.\\n\\nVocê é essencialmente impressionável, generoso e protetor; por isso, deve tomar cuidado para não dar muito à pessoa errada.\\n\\nQuanto mais amplas forem as suas idéias, mais feliz você será. Você poderá se tomar famoso nos campos artístico e profissional.","dia.10":"Você nasceu para dirigir e ser independente; assim, não procure apoiar-se em outras pessoas, já que elas é que dependem de você.\\n\\nVocê não deve trabalhar subordinado a outra pessoa, pois isso não dará certo, já que você é um individualista e poderá empreender, simultaneamente, vários caminhos, desde que esteja à frente.\\n\\nCultive as suas capacidades artísticas.\\n\\nQualquer atividade individual é melhor para você, pois pela sua determinação, você será bem sucedido, em qualquer campo que escolher.","dia.11":"O 11, tal como o 22, é um número fundamental. Se você nasceu neste dia terá grandes ideais e aspirações.\\n\\nSua grande dificuldade é que você, muitas vezes, deixa a razão sobrepor-se à intuição. Esta atitude não o levará a coisas boas, já que você tem qualidades mediúnicas, é sensitivo e deve seguir a sua intuição.\\n\\nSendo o 11 um número principal, você estará sempre sob alta vibração e precisará saber manter o equilíbrio mesmo com os nervos à flor da pele. Para sua saúde e felicidade são indispensáveis o controle e o meio termo. Apesar de sua inteligência acima da média, você deve seguir suas intuições, pois elas permitirão que seu grande potencial se manifeste de modo incomum.","dia.12":"Você tem uma personalidade cordial e amistosa, inteligência prática e talento literário ou artístico. Se o seu meio ambiente for suficientemente estimulante e o seu amor à vida se mantiver, você será um companheiro encantador e um verdadeiro perito em vendas e propaganda.\\n\\nMas, se os amores e as amizades estiverem causando problemas, você ficará triste, sombrio e desencorajado, já que o amor e a amizade são importantes na sua vida.\\n\\nO mundo das diversões e das atividades literárias é o mais indicado para você.","dia.13":"Muitas vezes você começa as coisas com o pé esquerdo e, não o compreendendo, as pessoas, consideram-no áspero e ditatorial, pois você tem dificuldades em expressar seus sentimentos.\\n\\nSendo você uma pessoa ambiciosa e que trabalha duro, gosta de organizar e administrar os outros. Você se preocupa com os pormenores, com a ciência e a mecânica. Tente manifestar melhor os seus sentimentos, use a imaginação e, se possível, cultive um hobby como o entalhe em madeira ou a escultura.","dia.14":"Você é versátil, de natureza dupla e de inteligência, ao mesmo tempo, lógica e imaginativa. Você pode construir ou destruir, tão poderosa é a força do número do seu nascimento. Você está sempre com um pé na terra e outro no céu, tendo, pois, condições de harmonizar as coisas práticas e espirituais.\\n\\nVocê gosta do que é novo e original, da mudança e da variedade. Isso poderá levá-lo a um excesso de experiências em vários campos, o que não será bom,- pois, para vencer, precisará de estabilidade na profissão.","dia.15":"Você é uma pessoa que gosta de cooperar, de dar, e é simpático. Gosta de ajudar e de assumir responsabilidades. Mas não deve permanecer num meio ambiente em que se sinta dominado, reprimido, porque isto afetará a sua saúde e bem-estar. Você aprecia tudo o que é bom e belo na vida e necessita de um lar feliz, harmonioso, com um companheiro que lhe permita ser o que você realmente é.\\n\\nTerá sucesso nos campos artístico e profissional.","dia.16":"O 16 é um número espiritual, levando as pessoas nascidas nesse dia a darem mais importância às coisas espirituais do que às terrenas. Contudo, sua inteligência prática e inventiva poderá torná-las bem sucedidas no mundo dos negócios. Contudo, para se sentir melhor, você que é deste número deverá desenvolver as aptidões literárias, artísticas e musicais, inatas em sua pessoa.\\n\\nVocê é um perfeccionista e pode se irritar, ficar deprimido e de mal-humor quando não consegue atingir a perfeição. Precisa de um lar onde se sinta independente e amado.","dia.17":"Suas variações de humor e atitudes são, em geral, bem acentuadas. Entretanto, a família e a pessoa amada são muito importantes para você, que é sensível e emocional, no que se refere à sua vida privada e aos seus negócios.\\n\\nO número 17 é considerado um grande número de nascimento, no que concerne às finanças. Tome as grandes decisões e deixe as pequenas para os outros. Se você souber utilizar adequadamente suas qualidades nunca sentirá falta de dinheiro.","dia.18":"Você é independente, eficiente, um líder nato. O mundo intelectual exerce sobre você grande fascínio e, nele, você sabe se expressar.\\n\\nSua personalidade apresenta um lado emocional e sensível, que o faz gostar da música — mas você é muito contestador.\\n\\nO melhor para você seria usar essa capacidade crítica, como ensaísta ou escritor. Você terá uma vida muito ativa e fará muitas viagens.","dia.19":"Você é uma pessoa radical nas suas atitudes, sujeita a variações de humor que percorrem toda a escala numérica, de 1 a 9. Você vive a sua vida sempre à beira de um precipício, de forma profundamente emocional, mas tem imensos recursos e consegue sempre enfrentar as dificuldades.\\n\\nUtilize a sua versatilidade e idéias originais e jamais sofrerá necessidades. Evite manter-se sempre no mesmo caminho e faça das mudanças uma constante na sua vida, para não sofrer decepções. Escolha com cuidado o seu companheiro, pois o seu número de nascimento indica que você poderá ter muitos problemas no casamento.","dia.20":"Você é, acima de tudo, um tipo emocional. Precisa de amigos, de camaradagem, do conforto e apoio dado pelos outros. Você deseja se sentir seguro no lar e entre seus familiares e será bem sucedido nos assuntos domésticos, onde a sua capacidade de compreender e absorver os pormenores será um fator positivo.\\n\\nVocê tem talentos musicais ou artísticos que deverá desenvolver.\\n\\nEvite ser dominado pelas emoções, pois, do contrário, granjeará reputação de volúvel. Cultivando o seu dom natural de simpatia e o trato paciente com os pormenores, você poderá ser bem sucedido.","dia.21":"Para ser realmente feliz, você deve encontrar meios para se expressar na literatura e nas artes.\\n\\nVocê é cauteloso e encantador mas, também, individualista e independente. Todavia, se você fizer várias coisas ao mesmo tempo, dispersará suas forças e energia.\\n\\nVocê gosta de estar cercado de coisas boas e belas e é um excelente anfitrião.\\n\\nNo campo emocional, é muito instável, sujeito a altos e baixos; o amor, para o bem e para o mal, é sempre um impacto na sua vida. Nesse terreno, em geral, você prefere receber a dar.\\n\\nVocê será bem sucedido no mundo literário. Aproveite os seus períodos de repouso para ler, ver os amigos e ter vida social mais i
